<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #webcam {
            display: none;
        }
        #webcam-display {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 100;
        }
        #startScreen h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(255,200,100,0.5);
        }
        #startScreen p {
            font-size: 1.3rem;
            opacity: 0.7;
            margin-bottom: 2rem;
        }
        #startBtn {
            font-size: 1.5rem;
            padding: 1rem 3rem;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #startBtn:hover { background: rgba(255,255,255,0.25); border-color: #fff; }
        #startBtn:disabled { opacity: 0.4; cursor: not-allowed; }
        #status {
            position: absolute;
            top: 12px; left: 12px;
            font-size: 0.75rem;
            opacity: 0.45;
            z-index: 150;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* ─── Subtitle box (hidden — now canvas-rendered) ─── */
        #subtitle-box { display: none; }

        /* ─── Tweaks panel ─── */
        #tweaks-toggle {
            position: absolute;
            top: 12px; right: 12px;
            z-index: 200;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: sans-serif;
        }
        #tweaks-toggle:hover { background: rgba(255,255,255,0.15); }
        #tweaks-panel {
            position: absolute;
            top: 44px; right: 12px;
            z-index: 200;
            background: rgba(15, 15, 20, 0.92);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 16px 20px;
            width: 460px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
            font-family: sans-serif;
            font-size: 0.78rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #tweaks-panel.open { display: block; }
        #tweaks-panel h3 {
            margin: 12px 0 6px 0;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
        }
        #tweaks-panel h3:first-child { margin-top: 0; }
        .tweak-row {
            display: flex;
            align-items: center;
            margin: 5px 0;
            gap: 8px;
        }
        .tweak-row label {
            flex: 0 0 100px;
            opacity: 0.8;
        }
        .tweak-row input[type="range"] {
            flex: 1;
            accent-color: #88aaff;
        }
        .tweak-row input[type="number"] {
            flex: 0 0 62px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 4px;
            color: #fff;
            text-align: left;
            font-size: 0.75rem;
            font-family: monospace;
            padding: 3px 6px;
            -moz-appearance: textfield;
        }
        .tweak-row input[type="number"]::-webkit-inner-spin-button,
        .tweak-row input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }
        .tweak-btn {
            width: 100%;
            margin: 10px 0 4px 0;
            padding: 6px 0;
            background: rgba(136,170,255,0.15);
            border: 1px solid rgba(136,170,255,0.4);
            color: #88aaff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            font-family: sans-serif;
        }
        .tweak-btn:hover { background: rgba(136,170,255,0.25); }
        .tweak-select {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 4px;
            color: #fff;
            font-size: 0.78rem;
            font-family: sans-serif;
            padding: 5px 8px;
            margin: 4px 0 8px 0;
        }
        .tweak-select option { background: #1a1a2e; color: #fff; }
        .tweak-accordion {
            margin: 8px 0 4px 0;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            overflow: hidden;
        }
        .tweak-accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(255,255,255,0.06);
            cursor: pointer;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            user-select: none;
        }
        .tweak-accordion-header:hover { opacity: 1; }
        .tweak-accordion-header::after {
            content: '▸';
            transition: transform 0.2s;
        }
        .tweak-accordion.open .tweak-accordion-header::after {
            transform: rotate(90deg);
        }
        .tweak-accordion-body {
            display: none;
            padding: 6px 10px;
        }
        .tweak-accordion.open .tweak-accordion-body {
            display: block;
        }
        /* ─── Calibration overlay ─── */
        .calib-corner {
            position: absolute;
            width: 24px; height: 24px;
            border: 2px solid #0f0;
            border-radius: 50%;
            background: rgba(0,255,0,0.25);
            cursor: grab;
            z-index: 180;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        .calib-corner.active { border-color: #ff0; background: rgba(255,255,0,0.35); }
        .calib-corner:hover { background: rgba(0,255,0,0.5); }
        .calib-corner.output-mode { border-color: #88aaff; background: rgba(136,170,255,0.25); }
        .calib-corner.output-mode:hover { background: rgba(136,170,255,0.5); }
        .calib-corner.output-mode.active { border-color: #ff0; background: rgba(255,255,0,0.35); }
        .calib-corner.grid-point { width: 18px; height: 18px; border-style: dashed; }
        .calib-label {
            position: absolute;
            color: #0f0;
            font-size: 0.65rem;
            font-family: monospace;
            pointer-events: none;
            z-index: 181;
            text-shadow: 0 0 3px #000, 0 0 6px #000;
            transform: translate(-50%, 14px);
        }
        .calib-label.output-mode { color: #88aaff; }
        .calib-label.active { color: #ff0; }
        #calib-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 175;
            pointer-events: none;
            display: none;
        }
        #calib-overlay.active { display: block; }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="webcam-display"></canvas>
        <canvas id="overlay"></canvas>
        <div id="subtitle-box"></div>
        <div id="calib-overlay"></div>
        <div id="status">Loading...</div>
        <button id="tweaks-toggle">Parameters</button>
        <div id="tweaks-panel"></div>
        <div id="startScreen">
            <h1>Musikase</h1>
            <p>Hallelujah &mdash; Leonard Cohen</p>
            <button id="startBtn" disabled>Loading...</button>
        </div>
    </div>

    <script type="module">
        import { FaceLandmarker, PoseLandmarker, FilesetResolver } from
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

        // ─── DOM ───
        const video       = document.getElementById('webcam');
        const dispCanvas  = document.getElementById('webcam-display');
        const dispCtx     = dispCanvas.getContext('2d');
        const canvas      = document.getElementById('overlay');
        const ctx         = canvas.getContext('2d');
        // Offscreen canvas for rendering particles before output warp
        const offCanvas   = document.createElement('canvas');
        const offCtx      = offCanvas.getContext('2d');
        const statusEl    = document.getElementById('status');
        const subtitleBox = document.getElementById('subtitle-box');
        const startScreen = document.getElementById('startScreen');
        const startBtn    = document.getElementById('startBtn');
        const tweaksToggle = document.getElementById('tweaks-toggle');
        const tweaksPanel  = document.getElementById('tweaks-panel');

        // ─── Audio ───
        const AUDIO_URL = 'Hallelujah_-_Leonard_Cohen_Karaoke_Version_KaraFun.wav';
        const audio = new Audio(AUDIO_URL);
        audio.preload = 'auto';
        // Static servers (like python -m http.server) often don't honor HTTP Range
        // requests, which breaks audio.currentTime seeking. Fetch the WAV once and
        // swap src to a blob URL — blob URLs support seeking natively regardless.
        fetch(AUDIO_URL).then(r => r.blob()).then(blob => {
            audio.src = URL.createObjectURL(blob);
        }).catch(e => console.warn('Audio blob fetch failed (seeking may not work):', e));

        // ─── Tweakable params ───
        // Hardcoded fallback defaults
        const P_HARDCODED = {
            charSize:170, depthScale:0.10, depthFullAt:0.77, depthEaseIn:3.80, depthEaseOut:2, charLifetime:12, noiseAmp:0, noiseFreq:0.50,
            mouthSmooth:0.8, fadeInStart:0, fadeInEnd:0.05, edgeFadeLeft:200,
            cp1Along:-0.5, cp1Perp:0.48, cp2Along:0.19, cp2Perp:0.24,
            midX:0.15, midY:0.35, midTanIn:0.65, midTanInAngle:0, midTanOut:0.65, midTanOutAngle:0, useMidpoint:1,
            targetX:0, targetY:0.2, targetYTrack:0.35, trackGrace:2, wordGap:0.1, letterKerning:0, kerningReach:0.3, kerningUniformity:0,
            spellTransStart:0.18, spellTransEnd:0.44, spellFadeSpeed:3.80, spellGrouping:1.70, spellLeaderSlow:0.10, finalWordKerning:-0.025,
            colorStartR:255, colorStartG:255, colorStartB:255,
            colorEndR:220, colorEndG:50, colorEndB:50,
            burstDistance:300, burstDuration:0.12, dirSensitivity:0.15, dirBiasX:0, targetNoise:60,
            fadeStart:0.95, fadeEnd:1.0, minCharScale:0.31, scaleNormAt:0.5, linearBlend:0.75, syncOffset:0, mouthSyncOffset:0,
            subX:0, subY:40, subScale:1, subMaxWidth:600,
            imgScale:1, imgX:0, imgY:0, imgRotation:0,
            ksTLx:0, ksTLy:0, ksTRx:0, ksTRy:0,
            ksBLx:0, ksBLy:0, ksBRx:0, ksBRy:0,
            ksET1x:0, ksET1y:0, ksET2x:0, ksET2y:0,
            ksEB1x:0, ksEB1y:0, ksEB2x:0, ksEB2y:0,
            ksEL1x:0, ksEL1y:0, ksEL2x:0, ksEL2y:0,
            ksER1x:0, ksER1y:0, ksER2x:0, ksER2y:0,
            ksG11x:0, ksG11y:0, ksG12x:0, ksG12y:0,
            ksG21x:0, ksG21y:0, ksG22x:0, ksG22y:0,
            // Output keystone
            outTLx:0, outTLy:0, outTRx:0, outTRy:0,
            outBLx:0, outBLy:0, outBRx:0, outBRy:0,
            outET1x:0, outET1y:0, outET2x:0, outET2y:0,
            outEB1x:0, outEB1y:0, outEB2x:0, outEB2y:0,
            outEL1x:0, outEL1y:0, outEL2x:0, outEL2y:0,
            outER1x:0, outER1y:0, outER2x:0, outER2y:0,
            outG11x:0, outG11y:0, outG12x:0, outG12y:0,
            outG21x:0, outG21y:0, outG22x:0, outG22y:0,
            gridV1:0.333, gridV2:0.667, gridH1:0.333, gridH2:0.667,
            outScale:1, outImgX:0, outImgY:0, outRotation:0,
            lyricsFlipped: true,
            cameraMirrored: false,
            trackOffsetX: 0, trackOffsetY: 0,
            calibNudge: 0.5,
            cameraDeviceId: '',
        };

        // Load defaults from params.json (persists across server restarts)
        let P_DEFAULTS = { ...P_HARDCODED };
        const P = { ...P_HARDCODED };

        async function loadParams() {
            try {
                const res = await fetch('params.json?' + Date.now());
                if (res.ok) {
                    const saved = await res.json();
                    Object.assign(P_DEFAULTS, saved);
                    Object.assign(P, P_DEFAULTS);
                }
            } catch (e) { console.warn('Could not load params.json:', e); }
        }

                { key: 'linearBlend', label: 'Linear blend at', min: 0.3, max: 1.0, step: 0.01 },

                { key: 'outTLx',       label: 'TL X %',        min: -50, max: 50, step: 0.5 },

            // Jump to the final Hallelujah cluster (starts around 4:05).

            // Rebuild the corner/point selector dropdown for current sub-mode
            function rebuildCalibSelect() {

            // Calibration toggle helper
            function toggleCalib(target) {

        tweaksToggle.addEventListener('click', () => {

        // ─── State ───
        let lyricsFlipped    = P.lyricsFlipped;
        let cameraMirrored   = P.cameraMirrored;
        let showOutputGrid   = false;
        let showSplineViz    = false;
        let showInputGrid    = false;
        let showTrackingDot  = false;
        let calibMode        = false;
        let calibTarget      = null; // 'camera' or 'output'
        let calibSubMode     = 'keystone'; // 'keystone' or 'gridwarp'
        let calibSelectedCorner = 'TL';
        let calibDragging    = null;
        let faceLandmarker   = null;
        let poseLandmarker   = null;
        let lyricsData       = [];
        let running          = false;
        let lastDetectTs     = -1;
        let mouthX = 0, mouthY = 0;
        let smoothMouthX = 0, smoothMouthY = 0;
        let hasFace = false;
        let faceYaw = 0;       // -1 = facing left, +1 = facing right (screen space)
        let facePitch = 0;     // -1 = looking up, +1 = looking down
        let smoothYaw = 0;
        let smoothPitch = 0;

        // ─── Debug mode: bypass webcam and synthesize mouth + head pose ───
        // Enable via URL ?debug=1 or press "D" while running.
        // Mouth sits at bottom third and oscillates left/right; head yaw/pitch drift.
        let debugMode = /[?&]debug=1\b/.test(location.search);

        // Each particle: { char, spawnTime, startX, startY, seed, burstDx, burstDy }
        let particles        = [];
        let lastSegmentIndex = -1;
        let charSpawnIndex   = 0;

        // ─── Calibration: draggable corner handles ───
        const CALIB_CORNERS = ['TL', 'TR', 'BL', 'BR'];
        const CALIB_EDGE_POINTS = ['ET1', 'ET2', 'EB1', 'EB2', 'EL1', 'EL2', 'ER1', 'ER2'];
        const CALIB_GRID_NODES = ['G11', 'G12', 'G21', 'G22'];
        const CALIB_ALL_GRID = [...CALIB_CORNERS, ...CALIB_EDGE_POINTS, ...CALIB_GRID_NODES];
        const CALIB_KEY_MAPS = {
            camera: {
                TL: ['ksTLx','ksTLy'], TR: ['ksTRx','ksTRy'], BL: ['ksBLx','ksBLy'], BR: ['ksBRx','ksBRy'],
                ET1: ['ksET1x','ksET1y'], ET2: ['ksET2x','ksET2y'], EB1: ['ksEB1x','ksEB1y'], EB2: ['ksEB2x','ksEB2y'],
                EL1: ['ksEL1x','ksEL1y'], EL2: ['ksEL2x','ksEL2y'], ER1: ['ksER1x','ksER1y'], ER2: ['ksER2x','ksER2y'],
                G11: ['ksG11x','ksG11y'], G12: ['ksG12x','ksG12y'], G21: ['ksG21x','ksG21y'], G22: ['ksG22x','ksG22y'],
            },
            output: {
                TL: ['outTLx','outTLy'], TR: ['outTRx','outTRy'], BL: ['outBLx','outBLy'], BR: ['outBRx','outBRy'],
                ET1: ['outET1x','outET1y'], ET2: ['outET2x','outET2y'], EB1: ['outEB1x','outEB1y'], EB2: ['outEB2x','outEB2y'],
                EL1: ['outEL1x','outEL1y'], EL2: ['outEL2x','outEL2y'], ER1: ['outER1x','outER1y'], ER2: ['outER2x','outER2y'],
                G11: ['outG11x','outG11y'], G12: ['outG12x','outG12y'], G21: ['outG21x','outG21y'], G22: ['outG22x','outG22y'],
            },
        };
        // Default normalized positions for all point types
        const CALIB_CORNER_POS = { TL: [0, 0], TR: [1, 0], BL: [0, 1], BR: [1, 1] };
        function getCalibDefaultPos(name) {
            if (CALIB_CORNER_POS[name]) return CALIB_CORNER_POS[name];
            // Edge points: E{edge}{index} — position on the border at grid line crossings
            if (name.startsWith('E')) {
                const edge = name[1], idx = parseInt(name[2]);
                const t = idx === 1 ? P.gridV1 : P.gridV2;
                const s = idx === 1 ? P.gridH1 : P.gridH2;
                if (edge === 'T') return [t, 0];
                if (edge === 'B') return [t, 1];
                if (edge === 'L') return [0, s];
                if (edge === 'R') return [1, s];
            }
            // Grid nodes: G{row}{col} → (gridV{row}, gridH{col})
            const row = parseInt(name[1]), col = parseInt(name[2]);
            return [row === 1 ? P.gridV1 : P.gridV2, col === 1 ? P.gridH1 : P.gridH2];
        }
        function getCalibKeyMap() { return CALIB_KEY_MAPS[calibTarget] || CALIB_KEY_MAPS.camera; }

        // Get the base position for a point, accounting for corner keystone offsets.
        // Corners: absolute position from params. Edge/grid: interpolated from actual corners + own offset.
        function getCalibBasePos(name, w, h) {
            const keyMap = getCalibKeyMap();
            if (CALIB_CORNER_POS[name]) {
                const [du, dv] = CALIB_CORNER_POS[name];
                const kx = keyMap[name][0], ky = keyMap[name][1];
                return { x: w * (du + P[kx] / 100), y: h * (dv + P[ky] / 100) };
            }
            // Get actual corner positions (with keystone offsets)
            function cpos(cn) {
                const [du, dv] = CALIB_CORNER_POS[cn];
                const kx = keyMap[cn][0], ky = keyMap[cn][1];
                return { x: w * (du + P[kx] / 100), y: h * (dv + P[ky] / 100) };
            }
            function lerp2(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
            const tl = cpos('TL'), tr = cpos('TR'), bl = cpos('BL'), br = cpos('BR');
            // Edge points: interpolated from actual corners on the border
            if (name.startsWith('E')) {
                const edge = name[1], idx = parseInt(name[2]);
                if (edge === 'T') return lerp2(tl, tr, idx === 1 ? P.gridV1 : P.gridV2);
                if (edge === 'B') return lerp2(bl, br, idx === 1 ? P.gridV1 : P.gridV2);
                if (edge === 'L') return lerp2(tl, bl, idx === 1 ? P.gridH1 : P.gridH2);
                if (edge === 'R') return lerp2(tr, br, idx === 1 ? P.gridH1 : P.gridH2);
            }
            // Grid nodes: bilinear from actual corners at (gridV, gridH)
            const row = parseInt(name[1]), col = parseInt(name[2]);
            const u = row === 1 ? P.gridV1 : P.gridV2;
            const v = col === 1 ? P.gridH1 : P.gridH2;
            return bilerp(tl, tr, bl, br, u, v);
        }

        function getCornerScreenPos(corner) {
            const keyMap = getCalibKeyMap();
            const w = dispCanvas.clientWidth, h = dispCanvas.clientHeight;
            const base = getCalibBasePos(corner, w, h);
            if (CALIB_CORNER_POS[corner]) return base;
            // Non-corner points: base + own offset
            const kx = keyMap[corner][0], ky = keyMap[corner][1];
            return { x: base.x + w * (P[kx] / 100), y: base.y + h * (P[ky] / 100) };
        }

        function screenPosToParam(corner, sx, sy) {
            const keyMap = getCalibKeyMap();
            const w = dispCanvas.clientWidth, h = dispCanvas.clientHeight;
            const kx = keyMap[corner][0], ky = keyMap[corner][1];
            if (CALIB_CORNER_POS[corner]) {
                const [du, dv] = CALIB_CORNER_POS[corner];
                P[kx] = (sx / w - du) * 100;
                P[ky] = (sy / h - dv) * 100;
            } else {
                // Non-corner: offset from base position
                const base = getCalibBasePos(corner, w, h);
                P[kx] = (sx - base.x) / w * 100;
                P[ky] = (sy - base.y) / h * 100;
            }
            // Sync slider/number UI
            for (const k of [kx, ky]) {
                const slider = tweaksPanel.querySelector(`input[type="range"][data-key="${k}"]`);
                const numInp = document.getElementById('val-' + k);
                if (slider) slider.value = P[k];
                if (numInp) numInp.value = P[k].toFixed(2);
            }
        }

        function updateCalibCorners() {
            const overlay = document.getElementById('calib-overlay');
            if (!calibMode) { overlay.innerHTML = ''; return; }
            overlay.innerHTML = '';
            const isOut = calibTarget === 'output';
            const isGridWarp = calibSubMode === 'gridwarp';

            // Which points to show
            const visiblePoints = isGridWarp ? CALIB_ALL_GRID : CALIB_CORNERS;

            for (const c of visiblePoints) {
                const pos = getCornerScreenPos(c);
                const isEdge = CALIB_EDGE_POINTS.includes(c);
                const isGrid = CALIB_GRID_NODES.includes(c);
                // Handle
                const handle = document.createElement('div');
                handle.className = 'calib-corner' + (isOut ? ' output-mode' : '') + (c === calibSelectedCorner ? ' active' : '') + ((isGrid || isEdge) ? ' grid-point' : '');
                handle.style.left = pos.x + 'px';
                handle.style.top = pos.y + 'px';
                handle.dataset.corner = c;
                // Label
                const label = document.createElement('div');
                label.className = 'calib-label' + (isOut ? ' output-mode' : '') + (c === calibSelectedCorner ? ' active' : '');
                label.style.left = pos.x + 'px';
                label.style.top = pos.y + 'px';
                label.textContent = c;
                overlay.appendChild(handle);
                overlay.appendChild(label);

                // Mouse down → start drag
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    calibDragging = c;
                    calibSelectedCorner = c;
                    const sel = document.getElementById('calib-corner-select');
                    if (sel) sel.value = c;
                    updateCalibCorners();
                });
            }

            // Draw lines on a canvas overlay
            let lineCanvas = overlay.querySelector('canvas');
            if (!lineCanvas) {
                lineCanvas = document.createElement('canvas');
                lineCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none';
                overlay.insertBefore(lineCanvas, overlay.firstChild);
            }
            lineCanvas.width = dispCanvas.clientWidth;
            lineCanvas.height = dispCanvas.clientHeight;
            const lctx = lineCanvas.getContext('2d');
            const borderColor = isOut ? 'rgba(136,170,255,0.5)' : 'rgba(0,255,0,0.5)';
            const gridColor = isOut ? 'rgba(136,170,255,0.35)' : 'rgba(0,255,0,0.35)';

            // Get all point positions
            const ptTL = getCornerScreenPos('TL'), ptTR = getCornerScreenPos('TR');
            const ptBL = getCornerScreenPos('BL'), ptBR = getCornerScreenPos('BR');

            // Border outline (corners only)
            lctx.strokeStyle = borderColor;
            lctx.lineWidth = 1;
            lctx.beginPath();
            lctx.moveTo(ptTL.x, ptTL.y);
            lctx.lineTo(ptTR.x, ptTR.y);
            lctx.lineTo(ptBR.x, ptBR.y);
            lctx.lineTo(ptBL.x, ptBL.y);
            lctx.closePath();
            lctx.stroke();

            // Grid lines only in gridwarp mode
            if (isGridWarp) {
                const ptET1 = getCornerScreenPos('ET1'), ptET2 = getCornerScreenPos('ET2');
                const ptEB1 = getCornerScreenPos('EB1'), ptEB2 = getCornerScreenPos('EB2');
                const ptEL1 = getCornerScreenPos('EL1'), ptEL2 = getCornerScreenPos('EL2');
                const ptER1 = getCornerScreenPos('ER1'), ptER2 = getCornerScreenPos('ER2');
                const ptG11 = getCornerScreenPos('G11'), ptG12 = getCornerScreenPos('G12');
                const ptG21 = getCornerScreenPos('G21'), ptG22 = getCornerScreenPos('G22');

                lctx.strokeStyle = gridColor;
                lctx.lineWidth = 1;
                lctx.setLineDash([6, 4]);
                // H-line 1: EL1 → G11 → G21 → ER1
                lctx.beginPath();
                lctx.moveTo(ptEL1.x, ptEL1.y);
                lctx.lineTo(ptG11.x, ptG11.y);
                lctx.lineTo(ptG21.x, ptG21.y);
                lctx.lineTo(ptER1.x, ptER1.y);
                lctx.stroke();
                // H-line 2: EL2 → G12 → G22 → ER2
                lctx.beginPath();
                lctx.moveTo(ptEL2.x, ptEL2.y);
                lctx.lineTo(ptG12.x, ptG12.y);
                lctx.lineTo(ptG22.x, ptG22.y);
                lctx.lineTo(ptER2.x, ptER2.y);
                lctx.stroke();
                // V-line 1: ET1 → G11 → G12 → EB1
                lctx.beginPath();
                lctx.moveTo(ptET1.x, ptET1.y);
                lctx.lineTo(ptG11.x, ptG11.y);
                lctx.lineTo(ptG12.x, ptG12.y);
                lctx.lineTo(ptEB1.x, ptEB1.y);
                lctx.stroke();
                // V-line 2: ET2 → G21 → G22 → EB2
                lctx.beginPath();
                lctx.moveTo(ptET2.x, ptET2.y);
                lctx.lineTo(ptG21.x, ptG21.y);
                lctx.lineTo(ptG22.x, ptG22.y);
                lctx.lineTo(ptEB2.x, ptEB2.y);
                lctx.stroke();
                lctx.setLineDash([]);
            }
        }

        // Global mouse move/up for dragging
        document.addEventListener('mousemove', (e) => {
            if (!calibDragging) return;
            const rect = dispCanvas.getBoundingClientRect();
            const sx = e.clientX - rect.left;
            const sy = e.clientY - rect.top;
            screenPosToParam(calibDragging, sx, sy);
            updateCalibCorners();
        });
        document.addEventListener('mouseup', () => { calibDragging = null; });

        // Corner select dropdown sync
        document.addEventListener('change', (e) => {
            if (e.target.id === 'calib-corner-select') {
                calibSelectedCorner = e.target.value;
                updateCalibCorners();
            }
        });

        function log(msg) {
            console.log('[Karaoke]', msg);
            statusEl.textContent = msg;
        }

        // ─── Parse time "M.SS.F" → seconds ───
        function parseTime(timeStr) {
            const cleaned = timeStr.replace(/\s/g, '');
            const parts = cleaned.split('.');
            if (parts.length < 3) return 0;
            return (parseInt(parts[0],10)||0) * 60
                 + (parseInt(parts[1],10)||0)
                 + (parseInt(parts[2],10)||0) * 0.1;
        }

        // ─── Load lyrics ───
        async function loadLyrics() {
            log('Loading lyrics...');
            const resp = await fetch('Hallelujah.json');
            const raw  = await resp.json();
            lyricsData = raw.map((item, i) => {
                const seg  = item.segments[0];
                // Use phoneticWord for particles (has stretched chars like "Haaa lle luuuuuu jaaaah")
                // Use text or finalWord for the subtitle display
                const particleText  = seg.phoneticWord || seg.text || seg.finalWord || '';
                const subtitleText  = (seg.text || seg.finalWord || '').trim();

                // Build character mapping for phonetic→final spelling transition
                let charMap = null;
                const phonetic = (seg.phoneticWord || '').trim();
                const final_ = (seg.finalWord || '').trim();
                if (phonetic && final_) {
                    charMap = [];
                    let fi = 0;
                    let totalExtras = 0;
                    let keptCount = 0;
                    for (let ci = 0; ci < phonetic.length; ci++) {
                        if (fi < final_.length && phonetic[ci].toLowerCase() === final_[fi].toLowerCase()) {
                            charMap.push({ kept: true, finalChar: final_[fi], extrasBefore: totalExtras, keptIndex: keptCount });
                            keptCount++;
                            fi++;
                        } else {
                            charMap.push({ kept: false, finalChar: null, extrasBefore: 0, keptIndex: -1 });
                            totalExtras++;
                        }
                    }
                    // Store totalKept on all entries
                    for (const entry of charMap) entry.totalKept = keptCount;
                    // Second pass: for each gap of extras before a kept char,
                    // assign gapIndex (0 = closest to approaching kept) and gapSize
                    // so extras can fade sequentially as the kept char passes them.
                    for (let ci = charMap.length - 1; ci >= 0; ci--) {
                        if (charMap[ci].kept) {
                            // Walk backward through the extras preceding this kept char
                            let gapIdx = 0;
                            for (let ei = ci - 1; ei >= 0 && !charMap[ei].kept; ei--) {
                                charMap[ei].gapIndex = gapIdx++;
                            }
                            const gapSize = gapIdx;
                            for (let ei = ci - 1; ei >= 0 && !charMap[ei].kept; ei--) {
                                charMap[ei].gapSize = gapSize;
                            }
                        }
                    }
                    // Handle trailing extras (after last kept char) — fade all at once
                    for (const entry of charMap) {
                        if (!entry.kept && entry.gapSize === undefined) {
                            entry.gapIndex = 0;
                            entry.gapSize = 1;
                        }
                    }
                    // Third pass: for each extra, store prev and next kept char info
                    for (let ci = 0; ci < charMap.length; ci++) {
                        if (!charMap[ci].kept) {
                            // Next kept (approaching from behind)
                            for (let ki = ci + 1; ki < charMap.length; ki++) {
                                if (charMap[ki].kept) {
                                    charMap[ci].nextKeptCharIndex = ki;
                                    charMap[ci].nextKeptExtrasBefore = charMap[ki].extrasBefore;
                                    break;
                                }
                            }
                            // Previous kept (ahead, speeding away)
                            for (let ki = ci - 1; ki >= 0; ki--) {
                                if (charMap[ki].kept) {
                                    charMap[ci].prevKeptExtrasBefore = charMap[ki].extrasBefore;
                                    charMap[ci].prevKeptIndex = charMap[ki].keptIndex;
                                    break;
                                }
                            }
                        }
                    }
                }

                return {
                    index: i,
                    particleText,
                    subtitleText,
                    charMap,
                    start: parseTime(seg.startTime),
                    end:   parseTime(seg.endTime),
                };
            });
            log(`Loaded ${lyricsData.length} lyric segments`);
        }

        // ─── Init MediaPipe ───
