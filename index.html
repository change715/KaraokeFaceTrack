        // ─── Start webcam ───
        let currentDeviceId = '';

        async function startCamera(deviceId) {
            if (debugMode) { log('Debug mode: skipping camera.'); return; }
            log('Requesting camera...');
            // Stop existing tracks
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } } };
            if (deviceId) {
                constraints.video.deviceId = { exact: deviceId };
            } else {
                constraints.video.facingMode = 'user';
            }
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            currentDeviceId = stream.getVideoTracks()[0]?.getSettings()?.deviceId || '';
            await new Promise((resolve, reject) => {
                video.onloadedmetadata = resolve;
                video.onerror = reject;
                setTimeout(() => reject(new Error('Camera timeout')), 10000);
            });
            await video.play();
            log('Camera ready');
        }

        async function populateCameraSelect() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            const select = document.getElementById('camera-select');
            if (!select) return;
            select.innerHTML = '';
            for (const d of videoDevices) {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.textContent = d.label || `Camera ${select.options.length + 1}`;
                if (d.deviceId === currentDeviceId) opt.selected = true;
                select.appendChild(opt);
            }
            select.addEventListener('change', async () => {
                try {
                    await startCamera(select.value);
                } catch (e) { log('Camera switch error: ' + e.message); }
            });
        }

        function syncCanvasSize() {
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
                canvas.width = w; canvas.height = h;
                dispCanvas.width = w; dispCanvas.height = h;
                offCanvas.width = w; offCanvas.height = h;
            }
        }

        // ─── Keystone warp: draw video with corner-pin distortion ───
        // Uses triangulated mesh to approximate perspective warp

        // Compute "cover" crop: scale video to fill canvas, crop excess
        function coverRect(vw, vh, cw, ch) {
            const videoAR = vw / vh, canvasAR = cw / ch;
            let sx = 0, sy = 0, sw = vw, sh = vh;
            if (videoAR > canvasAR) {
                // Video wider — crop sides
                sw = vh * canvasAR;
                sx = (vw - sw) / 2;
            } else {
                // Video taller — crop top/bottom
                sh = vw / canvasAR;
                sy = (vh - sh) / 2;
            }
            return { sx, sy, sw, sh };
        }

        // Build 4x4 grid of control points (16 total) for a given prefix ('ks' or 'out').
        // Corners: from params. Interior nodes: from params.
        // Edge points: interpolated from corners only (stay on the border).
        // Returns a 4x4 array g[row][col] where row=0..3, col=0..3.
        // Rows: 0=top, 1=h1, 2=h2, 3=bottom. Cols: 0=left, 1=v1, 2=v2, 3=right.
        function getGrid16(prefix, w, h) {
            const v1 = P.gridV1, v2 = P.gridV2, h1 = P.gridH1, h2 = P.gridH2;
            function pt(name, du, dv) {
                const kx = prefix + name + 'x', ky = prefix + name + 'y';
                return { x: w * (du + (P[kx] || 0) / 100), y: h * (dv + (P[ky] || 0) / 100) };
            }
            function lerp2(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }

            // 4 corners
            const tl = pt('TL', 0, 0), tr = pt('TR', 1, 0);
            const bl = pt('BL', 0, 1), br = pt('BR', 1, 1);
            // Offset point: base position (from corners) + own param offset
            function ept(name, base) {
                const kx = prefix + name + 'x', ky = prefix + name + 'y';
                return { x: base.x + w * ((P[kx] || 0) / 100), y: base.y + h * ((P[ky] || 0) / 100) };
            }
            // 4 interior grid nodes: bilinear from corners + own offset
            const g11 = ept('G11', bilerp(tl, tr, bl, br, v1, h1));
            const g12 = ept('G12', bilerp(tl, tr, bl, br, v1, h2));
            const g21 = ept('G21', bilerp(tl, tr, bl, br, v2, h1));
            const g22 = ept('G22', bilerp(tl, tr, bl, br, v2, h2));
            // 8 edge points: corner interpolation + own offset
            const eT1 = ept('ET1', lerp2(tl, tr, v1)), eT2 = ept('ET2', lerp2(tl, tr, v2));
            const eB1 = ept('EB1', lerp2(bl, br, v1)), eB2 = ept('EB2', lerp2(bl, br, v2));
            const eL1 = ept('EL1', lerp2(tl, bl, h1)), eL2 = ept('EL2', lerp2(tl, bl, h2));
            const eR1 = ept('ER1', lerp2(tr, br, h1)), eR2 = ept('ER2', lerp2(tr, br, h2));

            return {
                pts: [
                    [tl,  eT1, eT2, tr ],
                    [eL1, g11, g21, eR1],
                    [eL2, g12, g22, eR2],
                    [bl,  eB1, eB2, br ],
                ],
                // Normalized u/v breakpoints for the 4 columns and 4 rows
                us: [0, v1, v2, 1],
                vs: [0, h1, h2, 1],
            };
        }

        // Map (u,v) in [0,1]x[0,1] through the 4x4 grid → screen position.
        // 9 patches: 3 columns x 3 rows.
        function gridWarpPoint(grid, u, v) {
            const { pts, us, vs } = grid;
            // Find which column (ci) and row (ri) patch we're in
            let ci = u < us[1] ? 0 : u < us[2] ? 1 : 2;
            let ri = v < vs[1] ? 0 : v < vs[2] ? 1 : 2;
            // Local coords within patch
            const lu = (u - us[ci]) / (us[ci + 1] - us[ci]);
            const lv = (v - vs[ri]) / (vs[ri + 1] - vs[ri]);
            return bilerp(pts[ri][ci], pts[ri][ci + 1], pts[ri + 1][ci], pts[ri + 1][ci + 1], lu, lv);
        }

        function hasGridWarp(prefix) {
            for (const name of [...CALIB_GRID_NODES, ...CALIB_EDGE_POINTS]) {
                if ((P[prefix + name + 'x'] || 0) !== 0 || (P[prefix + name + 'y'] || 0) !== 0) return true;
            }
            return false;
        }

        let blackoutMode = false;
        function drawWarpedVideo() {
            const w = dispCanvas.width, h = dispCanvas.height;
            if (!w || !h || video.readyState < 2) return;

            dispCtx.clearRect(0, 0, w, h);

            const vw = video.videoWidth, vh = video.videoHeight;
            const crop = coverRect(vw, vh, w, h);

            const hasWarp = P.ksTLx !== 0 || P.ksTLy !== 0 || P.ksTRx !== 0 || P.ksTRy !== 0 ||
                            P.ksBLx !== 0 || P.ksBLy !== 0 || P.ksBRx !== 0 || P.ksBRy !== 0;
            const hasGrid = hasGridWarp('ks');
            const hasImgTransform = P.imgScale !== 1 || P.imgX !== 0 || P.imgY !== 0 || P.imgRotation !== 0;

            if (!hasWarp && !hasGrid && !hasImgTransform) {
                dispCtx.save();
                if (cameraMirrored) {
                    dispCtx.translate(w, 0);
                    dispCtx.scale(-1, 1);
                }
                dispCtx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, w, h);
                dispCtx.restore();
                return;
            }

            // Build 4x4 grid
            let grid = getGrid16('ks', w, h);

            // Mirror X and/or apply image transform to all 16 points
            const needsXf = cameraMirrored || hasImgTransform;
            if (needsXf) {
                const cx = w / 2, cy = h / 2;
                const s = hasImgTransform ? P.imgScale : 1;
                const rad = hasImgTransform ? P.imgRotation * Math.PI / 180 : 0;
                const cosR = Math.cos(rad), sinR = Math.sin(rad);
                const tx = hasImgTransform ? P.imgX : 0, ty = hasImgTransform ? P.imgY : 0;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        let p = grid.pts[r][c];
                        if (cameraMirrored) p = { x: w - p.x, y: p.y };
                        if (hasImgTransform) {
                            let x = (p.x - cx) * s, y = (p.y - cy) * s;
                            p = { x: x * cosR - y * sinR + cx + tx, y: x * sinR + y * cosR + cy + ty };
                        }
                        grid.pts[r][c] = p;
                    }
                }
            }

            // Subdivide into grid for smooth warp
            const divs = 9;
            for (let gy = 0; gy < divs; gy++) {
                for (let gx = 0; gx < divs; gx++) {
                    const u0 = gx / divs, u1 = (gx + 1) / divs;
                    const v0 = gy / divs, v1 = (gy + 1) / divs;

                    const srcX0 = crop.sx + crop.sw * u0, srcX1 = crop.sx + crop.sw * u1;
                    const srcY0 = crop.sy + crop.sh * v0, srcY1 = crop.sy + crop.sh * v1;

                    const p00 = gridWarpPoint(grid, u0, v0);
                    const p10 = gridWarpPoint(grid, u1, v0);
                    const p01 = gridWarpPoint(grid, u0, v1);
                    const p11 = gridWarpPoint(grid, u1, v1);

                    drawTriangle(dispCtx, video,
                        srcX0, srcY0, srcX1, srcY0, srcX0, srcY1,
                        p00.x, p00.y, p10.x, p10.y, p01.x, p01.y);
                    drawTriangle(dispCtx, video,
                        srcX1, srcY0, srcX1, srcY1, srcX0, srcY1,
                        p10.x, p10.y, p11.x, p11.y, p01.x, p01.y);
                }
            }
        }

        function bilerp(tl, tr, bl, br, u, v) {
            return {
                x: (1 - v) * ((1 - u) * tl.x + u * tr.x) + v * ((1 - u) * bl.x + u * br.x),
                y: (1 - v) * ((1 - u) * tl.y + u * tr.y) + v * ((1 - u) * bl.y + u * br.y),
            };
        }

        // Draw a textured triangle using affine transform
        function drawTriangle(dCtx, img, sx0,sy0, sx1,sy1, sx2,sy2, dx0,dy0, dx1,dy1, dx2,dy2) {
            dCtx.save();
            dCtx.beginPath();
            dCtx.moveTo(dx0, dy0);
            dCtx.lineTo(dx1, dy1);
            dCtx.lineTo(dx2, dy2);
            dCtx.closePath();
            dCtx.clip();

            // Solve affine: source triangle → dest triangle
            const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
            if (Math.abs(denom) < 0.001) { dCtx.restore(); return; }

            const m11 = (dx0 * (sy1 - sy2) + dx1 * (sy2 - sy0) + dx2 * (sy0 - sy1)) / denom;
            const m12 = (dx0 * (sx2 - sx1) + dx1 * (sx0 - sx2) + dx2 * (sx1 - sx0)) / denom;
            const m13 = (dx0 * (sx1*sy2 - sx2*sy1) + dx1 * (sx2*sy0 - sx0*sy2) + dx2 * (sx0*sy1 - sx1*sy0)) / denom;
            const m21 = (dy0 * (sy1 - sy2) + dy1 * (sy2 - sy0) + dy2 * (sy0 - sy1)) / denom;
            const m22 = (dy0 * (sx2 - sx1) + dy1 * (sx0 - sx2) + dy2 * (sx1 - sx0)) / denom;
            const m23 = (dy0 * (sx1*sy2 - sx2*sy1) + dy1 * (sx2*sy0 - sx0*sy2) + dy2 * (sx0*sy1 - sx1*sy0)) / denom;

            dCtx.setTransform(m11, m21, m12, m22, m13, m23);
            dCtx.drawImage(img, 0, 0);
            dCtx.restore();
        }

        // ─── Output warp: corner-pin the overlay ───
        function applyOutputWarp() {
            const w = canvas.width, h = canvas.height;
            const hasWarp = P.outTLx !== 0 || P.outTLy !== 0 || P.outTRx !== 0 || P.outTRy !== 0 ||
                            P.outBLx !== 0 || P.outBLy !== 0 || P.outBRx !== 0 || P.outBRy !== 0;
            const hasGrid = hasGridWarp('out');
            const hasOutTransform = P.outScale !== 1 || P.outImgX !== 0 || P.outImgY !== 0 || P.outRotation !== 0;
            if (!hasWarp && !hasGrid && !hasOutTransform) return;

            offCtx.clearRect(0, 0, w, h);
            offCtx.drawImage(canvas, 0, 0);
            ctx.clearRect(0, 0, w, h);

            let grid = getGrid16('out', w, h);

            if (hasOutTransform) {
                const cx = w / 2, cy = h / 2;
                const s = P.outScale;
                const rad = P.outRotation * Math.PI / 180;
                const cosR = Math.cos(rad), sinR = Math.sin(rad);
                const tx = P.outImgX, ty = P.outImgY;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        let p = grid.pts[r][c];
                        let x = (p.x - cx) * s, y = (p.y - cy) * s;
                        grid.pts[r][c] = { x: x * cosR - y * sinR + cx + tx, y: x * sinR + y * cosR + cy + ty };
                    }
                }
            }

            const divs = 9;
            for (let gy = 0; gy < divs; gy++) {
                for (let gx = 0; gx < divs; gx++) {
                    const u0 = gx / divs, u1 = (gx + 1) / divs;
                    const v0 = gy / divs, v1 = (gy + 1) / divs;

                    const srcX0 = w * u0, srcX1 = w * u1;
                    const srcY0 = h * v0, srcY1 = h * v1;

                    const p00 = gridWarpPoint(grid, u0, v0);
                    const p10 = gridWarpPoint(grid, u1, v0);
                    const p01 = gridWarpPoint(grid, u0, v1);
                    const p11 = gridWarpPoint(grid, u1, v1);

                    drawTriangle(ctx, offCanvas,
                        srcX0, srcY0, srcX1, srcY0, srcX0, srcY1,
                        p00.x, p00.y, p10.x, p10.y, p01.x, p01.y);
                    drawTriangle(ctx, offCanvas,
                        srcX1, srcY0, srcX1, srcY1, srcX0, srcY1,
                        p10.x, p10.y, p11.x, p11.y, p01.x, p01.y);
                }
            }
        }

        // ─── Output grid overlay ───
        function renderInputGrid() {
            const w = dispCanvas.width, h = dispCanvas.height;
            if (!w || !h) return;

            dispCtx.save();

            // Black background
            dispCtx.fillStyle = '#000';
            dispCtx.fillRect(0, 0, w, h);

            // Border
            dispCtx.strokeStyle = 'rgba(0, 180, 255, 0.8)';
            dispCtx.lineWidth = 3;
            dispCtx.strokeRect(0, 0, w, h);

            // Grid lines
            dispCtx.strokeStyle = 'rgba(0, 180, 255, 0.3)';
            dispCtx.lineWidth = 1;
            const cols = 3, rows = 3;
            for (let i = 1; i < cols; i++) {
                const x = (w * i) / cols;
                dispCtx.beginPath();
                dispCtx.moveTo(x, 0);
                dispCtx.lineTo(x, h);
                dispCtx.stroke();
            }
            for (let i = 1; i < rows; i++) {
                const y = (h * i) / rows;
                dispCtx.beginPath();
                dispCtx.moveTo(0, y);
                dispCtx.lineTo(w, y);
                dispCtx.stroke();
            }

            dispCtx.restore();
        }

        function renderOutputGrid() {
            const w = canvas.width, h = canvas.height;
            let grid = getGrid16('out', w, h);

            if (P.outScale !== 1 || P.outImgX !== 0 || P.outImgY !== 0 || P.outRotation !== 0) {
                const cx = w / 2, cy = h / 2;
                const s = P.outScale;
                const rad = P.outRotation * Math.PI / 180;
                const cosR = Math.cos(rad), sinR = Math.sin(rad);
                const tx = P.outImgX, ty = P.outImgY;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        let p = grid.pts[r][c];
                        let x = (p.x - cx) * s, y = (p.y - cy) * s;
                        grid.pts[r][c] = { x: x * cosR - y * sinR + cx + tx, y: x * sinR + y * cosR + cy + ty };
                    }
                }
            }

            const segs = 12;
            ctx.save();
            ctx.lineWidth = 1;

            // Fine grid lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            const divs = 9;
            for (let i = 1; i < divs; i++) {
                const t = i / divs;
                ctx.beginPath();
                for (let j = 0; j <= segs; j++) {
                    const u = j / segs;
                    const pt = gridWarpPoint(grid, u, t);
                    if (j === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
                ctx.beginPath();
                for (let j = 0; j <= segs; j++) {
                    const v = j / segs;
                    const pt = gridWarpPoint(grid, t, v);
                    if (j === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
            }

            // Border (corners only)
            const g = grid.pts;
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(g[0][0].x, g[0][0].y);
            ctx.lineTo(g[0][3].x, g[0][3].y);
            ctx.lineTo(g[3][3].x, g[3][3].y);
            ctx.lineTo(g[3][0].x, g[3][0].y);
            ctx.closePath();
            ctx.stroke();

            // Corner dots
            ctx.fillStyle = 'rgba(0, 255, 100, 0.9)';
            for (const p of [g[0][0], g[0][3], g[3][0], g[3][3]]) {
                ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
            }
            // Interior grid node dots
            ctx.fillStyle = 'rgba(255, 200, 50, 0.9)';
            for (const p of [g[1][1], g[1][2], g[2][1], g[2][2]]) {
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();
        }

        // ─── Detect face ───
        // Grace period uses tweakable param (seconds → ms)
        let lastFaceSeenTs = 0;
        let lastPoseDetectTs = -1;

        // Shared smoothing update for any tracking source
        function applyTracking(rawX, rawY, clampedYaw, clampedPitch, timestamp) {
            const sm = 1 - P.mouthSmooth;
            if (!hasFace) {
                smoothMouthX = rawX; smoothMouthY = rawY;
                smoothYaw = clampedYaw;
                smoothPitch = clampedPitch;
            } else {
                smoothMouthX += (rawX - smoothMouthX) * sm;
                smoothMouthY += (rawY - smoothMouthY) * sm;
                smoothYaw += (clampedYaw - smoothYaw) * sm * 0.5;
                smoothPitch += (clampedPitch - smoothPitch) * sm * 0.5;
            }
            mouthX = smoothMouthX + P.trackOffsetX;
            mouthY = smoothMouthY + P.trackOffsetY;
            faceYaw = smoothYaw;
            facePitch = smoothPitch;
            hasFace = true;
            lastFaceSeenTs = timestamp;
        }

        // Try face landmarks → face nose fallback → returns false if no face detected
        function tryFaceDetect(ts, timestamp) {
            if (!faceLandmarker) return false;
            const results = faceLandmarker.detectForVideo(dispCanvas, ts);
            if (!results.faceLandmarks || results.faceLandmarks.length === 0) return false;

            const lm = results.faceLandmarks[0];
            const upper = lm[13], lower = lm[14], nose = lm[1];
            const chin = lm[152];
            let trackX, trackY;

            if (upper && lower && upper.x > 0 && lower.x > 0) {
                trackX = (upper.x + lower.x) / 2;
                trackY = (upper.y + lower.y) / 2;
            } else if (nose) {
                const mouthEstY = chin ? (nose.y + chin.y) / 2 : nose.y + 0.04;
                trackX = nose.x;
                trackY = mouthEstY;
            } else {
                return false;
            }

            const rawX = trackX * canvas.width;
            const rawY = trackY * canvas.height;

            // Face yaw
            const rightEdge = lm[234], leftEdge = lm[454];
            const faceCX = (rightEdge.x + leftEdge.x) / 2;
            const faceW = Math.abs(rightEdge.x - leftEdge.x);
            const rawYaw = faceW > 0.001
                ? (nose.x - faceCX) / (faceW * 0.5)
                : 0;

            // Face pitch
            const forehead = lm[10];
            const faceCY = (forehead.y + chin.y) / 2;
            const faceH = Math.abs(chin.y - forehead.y);
            const rawPitch = faceH > 0.001
                ? (nose.y - faceCY) / (faceH * 0.5)
                : 0;

            applyTracking(rawX, rawY,
                Math.max(-1, Math.min(1, rawYaw)),
                Math.max(-1, Math.min(1, rawPitch)),
                timestamp);
            return true;
        }

        // Pose fallback: use head position from pose landmarks
        // Pose landmarks: 0=nose, 2=left eye inner, 5=right eye inner,
        //                 9=mouth left, 10=mouth right, 11=left shoulder, 12=right shoulder
        function tryPoseDetect(ts, timestamp) {
            if (!poseLandmarker) return false;
            if (ts <= lastPoseDetectTs) return false;
            lastPoseDetectTs = ts;

            const results = poseLandmarker.detectForVideo(dispCanvas, ts);
            if (!results.landmarks || results.landmarks.length === 0) return false;

            const lm = results.landmarks[0];
            const nose = lm[0];
            const mouthL = lm[9], mouthR = lm[10];
            if (!nose) return false;

            // Use pose mouth landmarks if available, else nose
            let trackX, trackY;
            if (mouthL && mouthR && mouthL.x > 0 && mouthR.x > 0) {
                trackX = (mouthL.x + mouthR.x) / 2;
                trackY = (mouthL.y + mouthR.y) / 2;
            } else {
                trackX = nose.x;
                trackY = nose.y + 0.04; // offset down toward mouth
            }

            const rawX = trackX * canvas.width;
            const rawY = trackY * canvas.height;

            // Estimate yaw from shoulders
            const lShoulder = lm[11], rShoulder = lm[12];
            let estYaw = 0;
            if (lShoulder && rShoulder) {
                const shoulderCX = (lShoulder.x + rShoulder.x) / 2;
                const shoulderW = Math.abs(lShoulder.x - rShoulder.x);
                if (shoulderW > 0.01) {
                    estYaw = (nose.x - shoulderCX) / (shoulderW * 0.5);
                    estYaw = Math.max(-1, Math.min(1, estYaw));
                }
            }

            applyTracking(rawX, rawY, estYaw, 0, timestamp);
            return true;
        }

        // Debug-mode tracker: synthesize a mouth at bottom third oscillating
        // left/right, plus slowly drifting head yaw/pitch. Writes to the same
        // smoothing path real tracking uses.
        function tryDebugSim(timestamp) {
            const t = timestamp / 1000;
            const w = canvas.width || window.innerWidth;
            const h = canvas.height || window.innerHeight;
            // Mouth: bottom third, 8-second lateral sweep at ±30% of width.
            const rawX = w * 0.5 + Math.sin(t * (2 * Math.PI / 8)) * (w * 0.30);
            const rawY = h * 0.66;
            // Head drift: two slow offset sines so yaw and pitch move independently.
            const yaw   = Math.sin(t * 0.35 + 0.7) * 0.4 + Math.sin(t * 0.17 + 2.1) * 0.2;
            const pitch = Math.sin(t * 0.28 + 2.4) * 0.3;
            applyTracking(rawX, rawY, yaw, pitch, timestamp);
        }

        function detectFace(timestamp) {
            const ts = Math.round(timestamp);
            if (ts <= lastDetectTs) return;
            lastDetectTs = ts;
            if (debugMode) { tryDebugSim(timestamp); return; }
            try {
                // Primary: face landmarks (mouth → face nose fallback)
                if (tryFaceDetect(ts, timestamp)) return;

                // Secondary: pose tracking (works at distance / extreme angles)
                if (tryPoseDetect(ts, timestamp)) return;

                // No tracking source — grace period before giving up
                if (hasFace && (timestamp - lastFaceSeenTs) > P.trackGrace * 1000) {
                    hasFace = false;
                }
            } catch (e) { console.warn('Face detect error:', e); }
        }

        // ─── Noise ───
        function noise(t, seed) {
            return Math.sin(t * 2.1 + seed * 1.7) * 0.5
                 + Math.sin(t * 4.3 + seed * 3.1) * 0.3
                 + Math.sin(t * 7.7 + seed * 0.3) * 0.2;
        }

        // ─── Cubic bezier ───
        function cubicBezier(t, p0, p1, p2, p3) {
            const u = 1-t, u2 = u*u, u3 = u2*u, t2 = t*t, t3 = t2*t;
            return u3*p0 + 3*u2*t*p1 + 3*u*t2*p2 + t3*p3;
        }

        // ─── Get particle position ───
        // Two-segment cubic bezier: start → CP1 → mid, mid → CP2 → target
        function getParticlePos(p, t) {
            const W = canvas.width, H = canvas.height;
            // Target with per-particle vertical noise
            // Target tracks face with a fixed offset — no thresholds, no jumps.
            // Face moves right → target moves right. Face moves down → target moves down.
            let tx = p.startX - W * 0.5;
            const baseY = p.targetBaseY != null ? p.targetBaseY : p.startY;
            let ty = H * P.targetY + (baseY - H * P.targetY) * P.targetYTrack;
            // Never let target drift right of the configured targetX
            tx = Math.min(tx, W * P.targetX);
            // Clamp spline span so extreme mouth positions don't produce
            // wildly long/short curves (e.g. debug oscillation or head movement).
            const maxSpan = W * 0.6;
            if (p.startX - tx > maxSpan) tx = p.startX - maxSpan;
            const targetOffset = (Math.sin(p.seed * 7.13) * 0.5 + Math.sin(p.seed * 3.71) * 0.3 + Math.sin(p.seed * 11.3) * 0.2) * P.targetNoise;
            ty += targetOffset;

            if (!P.useMidpoint) {
                // Single cubic Bézier: start → target using cp1/cp2 relative to full span
                const dx = tx - p.startX, dy = ty - p.startY;
                const len = Math.sqrt(dx*dx + dy*dy) || 1;
                const perpx = -dy / len, perpy = dx / len;
                const c1x = p.startX + dx * P.cp1Along + perpx * len * P.cp1Perp;
                const c1y = p.startY + dy * P.cp1Along + perpy * len * P.cp1Perp;
                const c2x = p.startX + dx * (1 - P.cp2Along) + perpx * len * P.cp2Perp;
                const c2y = p.startY + dy * (1 - P.cp2Along) + perpy * len * P.cp2Perp;
                return {
                    x: cubicBezier(t, p.startX, c1x, c2x, tx),
                    y: cubicBezier(t, p.startY, c1y, c2y, ty),
                };
            }

            // Fixed midpoint
            const mx = W * P.midX;
            const my = H * P.midY;

            // --- Segment 1: start → mid ---
            const dx1 = mx - p.startX, dy1 = my - p.startY;
            const len1 = Math.sqrt(dx1*dx1 + dy1*dy1) || 1;
            const perp1x = -dy1 / len1, perp1y = dx1 / len1;
            const cp1x = p.startX + dx1 * P.cp1Along + perp1x * len1 * P.cp1Perp;
            const cp1y = p.startY + dy1 * P.cp1Along + perp1y * len1 * P.cp1Perp;

            // --- Segment 2: mid → target ---
            const dx2 = tx - mx, dy2 = ty - my;
            const len2 = Math.sqrt(dx2*dx2 + dy2*dy2) || 1;
            const perp2x = -dy2 / len2, perp2y = dx2 / len2;
            const cp2x = mx + dx2 * P.cp2Along + perp2x * len2 * P.cp2Perp;
            const cp2y = my + dy2 * P.cp2Along + perp2y * len2 * P.cp2Perp;

            // Shared tangent at mid for C1 continuity (smooth curve through midpoint)
            const in_ux = dx1 / len1, in_uy = dy1 / len1;
            const out_ux = dx2 / len2, out_uy = dy2 / len2;
            const tanRawX = in_ux + out_ux, tanRawY = in_uy + out_uy;
            const tanRawLen = Math.sqrt(tanRawX * tanRawX + tanRawY * tanRawY) || 1;
            const tanUx = tanRawX / tanRawLen, tanUy = tanRawY / tanRawLen;
            const handleLenIn  = len1 * P.midTanIn;
            const handleLenOut = len2 * P.midTanOut;
            const inRad = P.midTanInAngle * Math.PI / 180;
            const cosIn = Math.cos(inRad), sinIn = Math.sin(inRad);
            const inDirX = tanUx * cosIn - tanUy * sinIn;
            const inDirY = tanUx * sinIn + tanUy * cosIn;
            const outRad = P.midTanOutAngle * Math.PI / 180;
            const cosOut = Math.cos(outRad), sinOut = Math.sin(outRad);
            const outDirX = tanUx * cosOut - tanUy * sinOut;
            const outDirY = tanUx * sinOut + tanUy * cosOut;
            const midBeforeX = mx - inDirX * handleLenIn;
            const midBeforeY = my - inDirY * handleLenIn;
            const midAfterX  = mx + outDirX * handleLenOut;
            const midAfterY  = my + outDirY * handleLenOut;

            if (t <= 0.5) {
                const lt = t * 2;
                return {
                    x: cubicBezier(lt, p.startX, cp1x, midBeforeX, mx),
                    y: cubicBezier(lt, p.startY, cp1y, midBeforeY, my),
                };
            } else {
                const lt = (t - 0.5) * 2;
                return {
                    x: cubicBezier(lt, mx, midAfterX, cp2x, tx),
                    y: cubicBezier(lt, my, midAfterY, cp2y, ty),
                };
            }
        }

        // ─── Arc-length reparameterization ───
        // Builds a lookup table so that equal t-steps produce equal pixel
        // distances along the curve, preventing letter bunching on tight bends.
        const ARC_SAMPLES = 64;
        function buildArcTable(p) {
            const table = new Float64Array(ARC_SAMPLES + 1);
            let prev = getParticlePos(p, 0);
            let totalLen = 0;
            table[0] = 0;
            for (let i = 1; i <= ARC_SAMPLES; i++) {
                const pt = getParticlePos(p, i / ARC_SAMPLES);
                totalLen += Math.sqrt((pt.x - prev.x) ** 2 + (pt.y - prev.y) ** 2);
                table[i] = totalLen;
                prev = pt;
            }
            return { table, totalLen };
        }

        function remapToArcLength(arcData, t) {
            const targetLen = t * arcData.totalLen;
            const tbl = arcData.table;
            const n = tbl.length - 1;
            // Binary search for the segment containing targetLen
            let lo = 0, hi = n;
            while (lo < hi - 1) {
                const mid = (lo + hi) >> 1;
                if (tbl[mid] < targetLen) lo = mid; else hi = mid;
            }
            const segLen = tbl[hi] - tbl[lo];
            const frac = segLen > 0 ? (targetLen - tbl[lo]) / segLen : 0;
            return (lo + frac) / n;
        }

        // ─── Spawn characters ───
        function updateLyricSpawning(currentTime) {
            let currentSeg = null, currentSegIdx = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].start && currentTime < lyricsData[i].end) {
                    currentSeg = lyricsData[i]; currentSegIdx = i; break;
                }
            }
            if (currentSegIdx !== lastSegmentIndex) {
                lastSegmentIndex = currentSegIdx;
                charSpawnIndex = 0;
                // Bake the segment's spline from mouth + face at segment start.
                // Post-burst, ALL letters in this segment ride this shared spline
                // so they can't overlap from spline divergence when the head moves.
                if (currentSeg && hasFace) {
                    currentSeg._targetBaseY = mouthY;
                    let sdx = faceYaw + P.dirBiasX, sdy = facePitch;
                    let sdl = Math.sqrt(sdx * sdx + sdy * sdy);
                    if (sdl < P.dirSensitivity) { sdx = -1; sdy = -0.2; sdl = Math.sqrt(sdx * sdx + sdy * sdy); }
                    sdx /= sdl; sdy /= sdl;
                    currentSeg._splineP = { startX: mouthX, startY: mouthY, burstDx: sdx, burstDy: sdy, seed: 0, targetBaseY: mouthY };
                    currentSeg._splineArcData = buildArcTable(currentSeg._splineP);
                }
            }
            if (!currentSeg || !hasFace) return;
            const text = currentSeg.particleText;
            if (!text || text.length === 0) return;
            const segDuration = currentSeg.end - currentSeg.start;
            if (segDuration <= 0) return;
            const elapsed = currentTime - currentSeg.start;

            // Cache numSpacesBefore for word-gap offset, and wordIndexInWord
            // (letter's position within its word, 0 for first letter of a word)
            // for within-word kerning nudge.
            if (!currentSeg._numSpacesBefore) {
                const nsb = new Int16Array(text.length);
                const wiw = new Int16Array(text.length);
                let spaces = 0, wordIdx = 0;
                for (let i = 0; i < text.length; i++) {
                    nsb[i] = spaces;
                    if (text[i] === ' ') {
                        spaces++;
                        wordIdx = 0;
                    } else {
                        wiw[i] = wordIdx;
                        wordIdx++;
                    }
                }
                currentSeg._numSpacesBefore = nsb;
                currentSeg._wordIndexInWord = wiw;
            }
            // Distribute chars evenly: first char spawns immediately, last char at ~95% of segment
            // Using (length) as divisor ensures all chars spawn before segment ends
            const charsToSpawn = Math.min(text.length,
                1 + Math.floor((elapsed / segDuration) * text.length));
            const now = performance.now() / 1000;
            while (charSpawnIndex < charsToSpawn && charSpawnIndex < text.length) {
                // Burst direction based on face yaw + pitch:
                // Build a 2D direction vector from face orientation
                // yaw: positive = facing right (screen), negative = facing left
                // pitch: positive = looking down, negative = looking up
                // Mirror yaw for screen space (webcam is mirrored)
                let dirX = faceYaw + P.dirBiasX;   // left/right (biased)
                let dirY = facePitch; // up/down
                // Normalize; if face is nearly centered, default to left burst
                let dirLen = Math.sqrt(dirX * dirX + dirY * dirY);
                if (dirLen < P.dirSensitivity) {
                    dirX = -1; dirY = -0.2; dirLen = Math.sqrt(dirX * dirX + dirY * dirY);
                }
                dirX /= dirLen; dirY /= dirLen;
                // Small sequential perpendicular offset so chars don't stack perfectly
                // but remain lined up in the burst direction
                const baseAngle = Math.atan2(dirY, dirX);
                const indexOffset = (charSpawnIndex / Math.max(text.length - 1, 1) - 0.5) * 0.15;
                const burstAngle = baseAngle + indexOffset;
                const cm = currentSeg.charMap ? currentSeg.charMap[charSpawnIndex] : null;
                particles.push({
                    char: text[charSpawnIndex],
                    spawnTime: now,
                    startX: mouthX,
                    startY: mouthY,
                    seed: Math.random() * 100,
                    burstDx: Math.cos(burstAngle),
                    burstDy: Math.sin(burstAngle),
                    charIndex: charSpawnIndex,
                    totalChars: text.length,

                    // Spelling transition data (null if no phoneticWord/finalWord)
                    isKept: cm ? cm.kept : undefined,
                    finalChar: cm ? cm.finalChar : undefined,
                    extrasBefore: cm ? cm.extrasBefore : 0,
                    keptIndex: cm ? (cm.keptIndex || 0) : 0,
                    totalKept: cm ? (cm.totalKept || 1) : 1,
                    gapIndex: cm ? (cm.gapIndex || 0) : 0,
                    gapSize: cm ? (cm.gapSize || 1) : 1,
                    nextKeptCharIndex: cm ? (cm.nextKeptCharIndex || 0) : 0,
                    nextKeptExtrasBefore: cm ? (cm.nextKeptExtrasBefore || 0) : 0,
                    prevKeptExtrasBefore: cm ? (cm.prevKeptExtrasBefore || 0) : 0,
                    prevKeptIndex: cm ? (cm.prevKeptIndex !== undefined ? cm.prevKeptIndex : -1) : -1,
                    segDuration: segDuration,
                    segIdx: currentSegIdx,
                    numSpacesBefore: currentSeg._numSpacesBefore[charSpawnIndex],
                    wordIndexInWord: currentSeg._wordIndexInWord[charSpawnIndex],
                    targetBaseY: currentSeg._targetBaseY || mouthY,
                });
                charSpawnIndex++;
            }
        }

        // ─── Karaoke-style subtitle (canvas-rendered) ───
        let subtitleData = null; // { text, highlightChars } or null

        function updateSubtitle(currentTime) {
            let curIdx = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].start && currentTime < lyricsData[i].end) {
                    curIdx = i; break;
                }
            }
            if (curIdx === -1) {
                for (let i = 0; i < lyricsData.length; i++) {
                    if (currentTime < lyricsData[i].start) { curIdx = i; break; }
                }
            }
            if (curIdx === -1) { subtitleData = null; return; }

            const seg = lyricsData[curIdx];
            const text = seg.particleText;

            if (currentTime < seg.start) {
                subtitleData = { text, highlightChars: -1 }; // -1 = all dim
                return;
            }

            const progress = (currentTime - seg.start) / (seg.end - seg.start);
            subtitleData = { text, highlightChars: progress * text.length };
        }

        function renderSubtitle() {
            if (!subtitleData) return;
            const { text, highlightChars } = subtitleData;
            const w = canvas.width, h = canvas.height;

            const fontSize = 22 * P.subScale;
            ctx.save();
            ctx.font = `${fontSize}px sans-serif`;
            ctx.textBaseline = 'middle';

            const padX = 28, padY = 12;
            const maxW = Math.min(P.subMaxWidth * P.subScale, w - padX * 2);
            const lineH = fontSize * 1.5;

            // Word-wrap into lines, tracking character indices
            const words = text.split(' ');
            const lines = [];       // [{text, startIdx}]
            let curLine = '';
            let curIdx = 0;
            for (let wi = 0; wi < words.length; wi++) {
                const word = words[wi];
                const test = curLine ? curLine + ' ' + word : word;
                if (curLine && ctx.measureText(test).width > maxW) {
                    lines.push({ text: curLine, startIdx: curIdx });
                    curIdx += curLine.length + 1; // +1 for space
                    curLine = word;
                } else {
                    curLine = test;
                }
            }
            if (curLine) lines.push({ text: curLine, startIdx: curIdx });

            // Compute box dimensions
            let widestLine = 0;
            for (const ln of lines) widestLine = Math.max(widestLine, ctx.measureText(ln.text).width);
            const totalTextH = lineH * lines.length;
            const boxW = Math.max(widestLine + padX * 2, 200);
            const boxH = totalTextH + padY * 2;

            // Position (anchored at bottom, clamped to canvas)
            const cx = w / 2 + P.subX;
            const by = h - P.subY;
            let boxX = cx - boxW / 2;
            const boxY = by - boxH;
            // Clamp horizontally to stay within canvas
            if (boxX < 0) boxX = 0;
            if (boxX + boxW > w) boxX = w - boxW;

            // Apply flip
            if (lyricsFlipped) {
                ctx.translate(cx, 0);
                ctx.scale(-1, 1);
                ctx.translate(-cx, 0);
            }

            // Background rounded rect
            const r = 10;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath();
            ctx.moveTo(boxX + r, boxY);
            ctx.lineTo(boxX + boxW - r, boxY);
            ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + r);
            ctx.lineTo(boxX + boxW, boxY + boxH - r);
            ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - r, boxY + boxH);
            ctx.lineTo(boxX + r, boxY + boxH);
            ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - r);
            ctx.lineTo(boxX, boxY + r);
            ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY);
            ctx.closePath();
            ctx.fill();

            // Draw each line
            for (let li = 0; li < lines.length; li++) {
                const ln = lines[li];
                const lnW = ctx.measureText(ln.text).width;
                let curX = boxX + (boxW - lnW) / 2;
                const curY = boxY + padY + lineH * li + lineH / 2;

                for (let ci = 0; ci < ln.text.length; ci++) {
                    const ch = ln.text[ci];
                    const gi = ln.startIdx + ci; // global char index
                    if (highlightChars === -1) {
                        ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    } else if (gi < Math.floor(highlightChars)) {
                        ctx.fillStyle = '#88aaff';
                    } else if (gi < highlightChars) {
                        const frac = highlightChars - gi;
                        const cr = Math.round(255 - (255 - 136) * frac);
                        const cg = Math.round(255 - (255 - 170) * frac);
                        ctx.fillStyle = `rgb(${cr},${cg},255)`;
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    }
                    ctx.fillText(ch, curX, curY);
                    curX += ctx.measureText(ch).width;
                }
            }

            ctx.restore();
        }

        // ─── Lerp helper ───
        function lerp(a, b, t) { return a + (b - a) * t; }

        // ─── Ease-out (quadratic): gentler than cubic for more consistent speed ───
        function easeOutQuad(t) {
            return 1 - (1 - t) * (1 - t);
        }
        // easeOutQuad with C1-continuous blend to linear past blendAt
        // Maintains constant speed after blendAt instead of decelerating to zero
        function easeBlended(linearT, blendAt) {
            if (blendAt >= 1.0 || linearT <= blendAt) {
                return easeOutQuad(linearT);
            }
            // Match value and derivative at blend point for smooth transition
            const valAtBlend = easeOutQuad(blendAt);
            const derivAtBlend = 2 * (1 - blendAt);
            return valAtBlend + derivAtBlend * (linearT - blendAt);
        }

        // ─── Render spline visualizer ───
        function renderSplineViz() {
            if (!hasFace) return;
            const W = canvas.width, H = canvas.height;
            // Draw a few sample splines from the current mouth position with varying seeds
            const seeds = [0, 15, 30, 50, 70, 85];
            ctx.save();
            for (let si = 0; si < seeds.length; si++) {
                const seed = seeds[si];
                const fakeP = { startX: mouthX, startY: mouthY, seed };
                // Sample the cubic bezier path
                const steps = 40;
                ctx.beginPath();
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const pos = getParticlePos(fakeP, t);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                const hue = (si / seeds.length) * 360;
                ctx.strokeStyle = `hsla(${hue}, 80%, 65%, 0.6)`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Draw control points for the first spline
                if (si === 0) {
                    const tx = W * P.targetX;
                    const tyBase = H * P.targetY;
                    const targetOffset = (Math.sin(seed * 7.13) * 0.5 + Math.sin(seed * 3.71) * 0.3 + Math.sin(seed * 11.3) * 0.2) * P.targetNoise;
                    const ty = tyBase + targetOffset;

                    // Start
                    ctx.fillStyle = 'rgba(255,255,100,0.8)';
                    ctx.beginPath(); ctx.arc(fakeP.startX, fakeP.startY, 5, 0, Math.PI * 2); ctx.fill();
                    // Target
                    ctx.fillStyle = 'rgba(100,255,100,0.8)';
                    ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2); ctx.fill();

                    if (!P.useMidpoint) {
                        // Single Bézier: show CP1/CP2
                        const dx = tx - fakeP.startX, dy = ty - fakeP.startY;
                        const len = Math.sqrt(dx*dx + dy*dy) || 1;
                        const perpx = -dy / len, perpy = dx / len;
                        const c1x = fakeP.startX + dx * P.cp1Along + perpx * len * P.cp1Perp;
                        const c1y = fakeP.startY + dy * P.cp1Along + perpy * len * P.cp1Perp;
                        const c2x = fakeP.startX + dx * (1 - P.cp2Along) + perpx * len * P.cp2Perp;
                        const c2y = fakeP.startY + dy * (1 - P.cp2Along) + perpy * len * P.cp2Perp;
                        ctx.fillStyle = 'rgba(255,100,100,0.8)';
                        ctx.beginPath(); ctx.arc(c1x, c1y, 5, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = 'rgba(100,100,255,0.8)';
                        ctx.beginPath(); ctx.arc(c2x, c2y, 5, 0, Math.PI * 2); ctx.fill();
                        ctx.setLineDash([4, 4]);
                        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(fakeP.startX, fakeP.startY); ctx.lineTo(c1x, c1y); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(c1x, c1y); ctx.lineTo(c2x, c2y); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(c2x, c2y); ctx.lineTo(tx, ty); ctx.stroke();
                        ctx.setLineDash([]);
                    } else {
                        const mx = W * P.midX, my = H * P.midY;
                        const dx1 = mx - fakeP.startX, dy1 = my - fakeP.startY;
                        const len1 = Math.sqrt(dx1*dx1 + dy1*dy1) || 1;
                        const perp1x = -dy1 / len1, perp1y = dx1 / len1;
                        const cp1x = fakeP.startX + dx1 * P.cp1Along + perp1x * len1 * P.cp1Perp;
                        const cp1y = fakeP.startY + dy1 * P.cp1Along + perp1y * len1 * P.cp1Perp;
                        const dx2 = tx - mx, dy2 = ty - my;
                        const len2 = Math.sqrt(dx2*dx2 + dy2*dy2) || 1;
                        const perp2x = -dy2 / len2, perp2y = dx2 / len2;
                        const cp2x = mx + dx2 * P.cp2Along + perp2x * len2 * P.cp2Perp;
                        const cp2y = my + dy2 * P.cp2Along + perp2y * len2 * P.cp2Perp;
                        // CP1
                        ctx.fillStyle = 'rgba(255,100,100,0.8)';
                        ctx.beginPath(); ctx.arc(cp1x, cp1y, 5, 0, Math.PI * 2); ctx.fill();
                        // Midpoint
                        ctx.fillStyle = 'rgba(255,200,50,0.8)';
                        ctx.beginPath(); ctx.arc(mx, my, 6, 0, Math.PI * 2); ctx.fill();
                        // CP2
                        ctx.fillStyle = 'rgba(100,100,255,0.8)';
                        ctx.beginPath(); ctx.arc(cp2x, cp2y, 5, 0, Math.PI * 2); ctx.fill();
                        // Compute mid tangent handles
                        const in_ux = dx1 / len1, in_uy = dy1 / len1;
                        const out_ux = dx2 / len2, out_uy = dy2 / len2;
                        const tanRawX = in_ux + out_ux, tanRawY = in_uy + out_uy;
                        const tanRawLen = Math.sqrt(tanRawX * tanRawX + tanRawY * tanRawY) || 1;
                        const tanUx = tanRawX / tanRawLen, tanUy = tanRawY / tanRawLen;
                        const handleLenIn  = len1 * P.midTanIn;
                        const handleLenOut = len2 * P.midTanOut;
                        const inRad = P.midTanInAngle * Math.PI / 180;
                        const cosIn = Math.cos(inRad), sinIn = Math.sin(inRad);
                        const inDirX = tanUx * cosIn - tanUy * sinIn;
                        const inDirY = tanUx * sinIn + tanUy * cosIn;
                        const outRad = P.midTanOutAngle * Math.PI / 180;
                        const cosOut = Math.cos(outRad), sinOut = Math.sin(outRad);
                        const outDirX = tanUx * cosOut - tanUy * sinOut;
                        const outDirY = tanUx * sinOut + tanUy * cosOut;
                        const midBeforeX = mx - inDirX * handleLenIn;
                        const midBeforeY = my - inDirY * handleLenIn;
                        const midAfterX  = mx + outDirX * handleLenOut;
                        const midAfterY  = my + outDirY * handleLenOut;
                        // Tangent lines
                        ctx.setLineDash([4, 4]);
                        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(fakeP.startX, fakeP.startY); ctx.lineTo(cp1x, cp1y); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(cp1x, cp1y); ctx.lineTo(midBeforeX, midBeforeY); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(midBeforeX, midBeforeY); ctx.lineTo(mx, my); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(midAfterX, midAfterY); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(midAfterX, midAfterY); ctx.lineTo(cp2x, cp2y); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(cp2x, cp2y); ctx.lineTo(tx, ty); ctx.stroke();
                        ctx.setLineDash([]);
                        // Mid tangent handle points
                        ctx.fillStyle = 'rgba(255,150,50,0.7)';
                        ctx.beginPath(); ctx.arc(midBeforeX, midBeforeY, 4, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(midAfterX, midAfterY, 4, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }
            ctx.restore();
        }

        // ─── Render particles ───
        const segAvgSmoothed = {}; // persistent smoothed avg size per segment
        function renderParticles(nowMs) {
            const nowSec = nowMs / 1000;
            // Spelling-segment letters get extended lifetime to compensate for
            // deceleration — they move slower so need more time to travel the
            // full spline and exit off-screen.
            particles = particles.filter(p => {
                const lifetime = (p.isKept !== undefined) ? P.charLifetime / Math.max(0.1, 1 - P.spellLeaderSlow) : P.charLifetime;
                return (nowSec - p.spawnTime) < lifetime;
            });

            const fontSpeedScale = Math.max(1, P.charSize / 80);
            const doAutoScale = P.minCharScale < 1.0;

            // Cache of each word's leader t (keyed by segIdx + word-start charIdx)
            // so within-word letters can share their leader's t for uniform spacing.
            const wordLeaderT = {};

            // Per-segment ordering clamp: tracks the previous kept letter's t so
            // a trailing kept letter's boost can never push it past the one ahead.
            const segPrevKeptT = {};

            // Pass 1: compute render data and per-char auto-scaled sizes
            const renderData = [];
            const segSizes = {}; // segIdx -> { sum, count } for averaging

            for (const p of particles) {
                const age = nowSec - p.spawnTime;

                const baseLinearT = Math.min(age / P.charLifetime, 1.0);
                const baseT = easeOutQuad(baseLinearT);

                let linearT = Math.min((age * fontSpeedScale) / P.charLifetime, 1.0);
                let t = easeBlended(linearT, P.linearBlend);

                // Per-letter spelling-transition progress driven by baseT.
                // Each letter's collapse ramps from 0→1 as it ages through
                // [spellTransStart, spellTransEnd] — so the word naturally
                // transitions as it moves along the spline.
                let spellTransProgress = 0;
                if (p.isKept !== undefined) {
                    spellTransProgress = Math.max(0, Math.min(1,
                        (baseT - P.spellTransStart) / (P.spellTransEnd - P.spellTransStart)));
                }

                // Kept letters: two opposing forces that compress the word.
                //   1. Positive age-boost (extrasBefore) — trailers speed up to catch leader
                //   2. Negative leader-slow — leaders decelerate so trailers have more time
                // The leader-slow scales with (1 − keptIndex/totalKept): full slow at
                // keptIndex=0 (leader), zero at the last kept letter.
                // Spelling-segment speed control: the WHOLE word decelerates
                // (baseSlow), giving trailing letters time to spawn and catch up.
                // On top of that deceleration, each letter gets an individual
                // speedup proportional to how many phonetic extras precede it —
                // so trailing kept letters close the gap while leading letters
                // (with fewer extras) stay slow together at the front.
                // Spelling speed modification — only AFTER burst naturally completes.
                // Slows the post-burst excess and ramps catchup from zero at burst-
                // end to full over the letter's life, so there's no position jump
                // at the burst-to-spline boundary and no backward motion.
                if (p.isKept !== undefined && spellTransProgress > 0 && linearT >= P.burstDuration) {
                    // Cubic ramp for deceleration (very gradual onset),
                    // smoothstep for catchup (engages slightly faster).
                    const slowRamp = spellTransProgress * spellTransProgress * spellTransProgress;
                    const catchupRamp = spellTransProgress * spellTransProgress * (3 - 2 * spellTransProgress);
                    const slowMul = 1 - slowRamp * P.spellLeaderSlow;
                    const catchup = (p.charIndex / Math.max(1, p.totalChars - 1)) * p.segDuration * P.spellGrouping;
                    const excess = linearT - P.burstDuration;
                    // Square-root ramp: much faster than linear early on (12% at
                    // excessFrac=0.01 vs 1.5%), so trailing letters get meaningful
                    // catchup right after burst. Still 0 at burst boundary (no jump).
                    const excessFrac = Math.sqrt(excess / Math.max(0.001, 1 - P.burstDuration));
                    linearT = P.burstDuration + excess * slowMul + catchupRamp * catchup / P.charLifetime * excessFrac;
                    t = easeBlended(linearT, P.linearBlend);
                }

                // Ordering clamp: no letter can pass the one ahead. No minimum
                // gap — letters that catch up simply match the ahead-letter's
                // speed. Visual separation comes from kerningUniformity ramp +
                // effectiveWordIdx × finalWordKerning, not from t-space gaps.
                if (p.isKept !== undefined) {
                    if (p.segIdx in segPrevKeptT && t > segPrevKeptT[p.segIdx]) {
                        t = segPrevKeptT[p.segIdx];
                    }
                    segPrevKeptT[p.segIdx] = t;
                }

                // Word-gap offset: post-space letters nudged forward on the spline.
                // Letter-kerning ramps in over the first P.kerningReach of t (smoothstep).
                // Kerning uniformity (0..1) blends each letter's t toward its word-leader's
                // t — at 1.0, all within-word letters derive position from the leader.
                const wordStartKey = p.segIdx + '_' + (p.charIndex - p.wordIndexInWord);
                if (!(wordStartKey in wordLeaderT)) wordLeaderT[wordStartKey] = t;
                const leaderT = wordLeaderT[wordStartKey];
                // During spelling transition, ramp uniformity toward 1.0 so all
                // letters converge to the leader's t — only finalWordKerning
                // separates them. This eliminates the "Ha llelu jah" gap clusters
                // caused by letters at different t values having different uniformBaseT.
                let effectiveUniformity = P.kerningUniformity;
                if (p.isKept !== undefined && spellTransProgress > 0) {
                    const uSmooth = spellTransProgress * spellTransProgress * (3 - 2 * spellTransProgress);
                    effectiveUniformity = P.kerningUniformity + (1.0 - P.kerningUniformity) * uSmooth;
                }
                const uniformBaseT = t + (leaderT - t) * effectiveUniformity;
                const kerningRampLinear = Math.max(0, Math.min(1, t / Math.max(0.001, P.kerningReach)));
                const kerningRamp = kerningRampLinear * kerningRampLinear * (3 - 2 * kerningRampLinear);
                // During spelling transition, letters migrate their kerning index
                // from the phonetic position (wordIndexInWord) toward the final-word
                // position. Kept letters target their own keptIndex; extras target
                // their preceding kept letter's keptIndex (they're being absorbed
                // into that kept letter as they fade). Without migrating extras too,
                // kept letters would slide past still-visible extras on the spline.
                let effectiveWordIdx = p.wordIndexInWord;
                if (spellTransProgress > 0) {
                    const kSmoothed = spellTransProgress * spellTransProgress * (3 - 2 * spellTransProgress);
                    let targetIdx = null;
                    if (p.isKept === true) {
                        targetIdx = p.keptIndex;
                    } else if (p.isKept === false && p.prevKeptIndex >= 0) {
                        targetIdx = p.prevKeptIndex;
                    }
                    if (targetIdx !== null) {
                        effectiveWordIdx = p.wordIndexInWord + (targetIdx - p.wordIndexInWord) * kSmoothed;
                    }
                }
                // During spelling transition, kerning transitions from letterKerning
                // (phonetic spacing) to finalWordKerning (collapsed word spacing).
                let effectiveKerning = P.letterKerning;
                if (p.isKept !== undefined && spellTransProgress > 0) {
                    const kSmooth = spellTransProgress * spellTransProgress * (3 - 2 * spellTransProgress);
                    effectiveKerning = P.letterKerning + (P.finalWordKerning - P.letterKerning) * kSmooth;
                }
                const rawTWithGap = uniformBaseT + p.numSpacesBefore * P.wordGap + effectiveWordIdx * effectiveKerning * kerningRamp;
                const tWithGap = (p.isKept !== undefined) ? rawTWithGap : Math.min(1, rawTWithGap);

                // Use the SEGMENT's shared spline (if available) so post-burst
                // letters all ride the same track — prevents overlap when head moves.
                // Fall back to per-particle spline if segment spline wasn't baked.
                const seg = lyricsData[p.segIdx];
                let splinePos;
                if (seg._splineP && seg._splineArcData) {
                    const posT = remapToArcLength(seg._splineArcData, tWithGap);
                    splinePos = getParticlePos(seg._splineP, posT);
                } else {
                    if (!p._arcData) p._arcData = buildArcTable(p);
                    const posT = remapToArcLength(p._arcData, tWithGap);
                    splinePos = getParticlePos(p, posT);
                }

                let pos;
                if (linearT < P.burstDuration) {
                    const burstT = linearT / P.burstDuration;
                    // Smoothstep blend: 0→1 with zero derivative at both ends
                    const blend = burstT * burstT * (3 - 2 * burstT);
                    // Burst from spawn-mouth (per-particle), toward segment spline
                    const burstEased = 1 - Math.pow(1 - burstT, 2);
                    const burstX = p.startX + p.burstDx * P.burstDistance * burstEased;
                    const burstY = p.startY + p.burstDy * P.burstDistance * burstEased;
                    pos = {
                        x: lerp(burstX, splinePos.x, blend),
                        y: lerp(burstY, splinePos.y, blend),
                    };
                } else {
                    pos = splinePos;
                }

                const noiseVal = noise(age * P.noiseFreq, p.seed) * P.noiseAmp;

                let alpha = 1.0;
                if (t < P.fadeInEnd) {
                    alpha = t <= P.fadeInStart ? 0 : (t - P.fadeInStart) / (P.fadeInEnd - P.fadeInStart);
                }
                // Fade-out: position-based for normal lyrics, age-based for spelling
                // segments. Age-based (baseLinearT) ensures older letters fade first
                // so "Hallelujah" fades sequentially H→a→l→...→h, not as a cluster.
                // Spelling letters use an earlier fade start (tied to spellTransEnd)
                // so they begin fading shortly after transition completes instead
                // of lingering at full alpha until the global fadeStart.
                // Spelling segments: age-based fade starting shortly after transition
                // completes (transEndLT + 0.05). No guard needed — effectiveFadeStart
                // is set high enough that fade begins after transition naturally ends.
                // Normal lyrics: position-based fade at user's fadeStart.
                const isSpell = p.isKept !== undefined;
                const fadeRef = isSpell ? baseLinearT : t;
                const transEndLT = 1 - Math.sqrt(1 - P.spellTransEnd);
                const effectiveFadeStart = isSpell ? (transEndLT + 0.05) : P.fadeStart;
                if (fadeRef > effectiveFadeStart) {
                    alpha *= 1.0 - (fadeRef - effectiveFadeStart) / (P.fadeEnd - effectiveFadeStart);
                }
                // Extras: sequential fade — gapIndex 0 (closest to the approaching
                // kept char) fades first; farthest fades last. Only begins once the
                // approaching kept char has been spawned.
                let extraFadeProgress = 0;
                if (p.isKept === false) {
                    const spawnGapSec = p.segDuration / p.totalChars;
                    const keptSpawned = p.nextKeptCharIndex > 0 &&
                        (age - (p.nextKeptCharIndex - p.charIndex) * spawnGapSec) > 0;

                    if (keptSpawned && spellTransProgress > 0) {
                        const fs = p.gapIndex / p.gapSize;
                        const fe = (p.gapIndex + 1) / p.gapSize;
                        extraFadeProgress = Math.max(0, Math.min(1, (spellTransProgress - fs) / (fe - fs)));
                    } else if (!p.nextKeptCharIndex && spellTransProgress > 0.5) {
                        // Trailing extras (no next kept char): fade in second half
                        extraFadeProgress = (spellTransProgress - 0.5) * 2;
                    }
                    alpha *= Math.pow(1.0 - extraFadeProgress, P.spellFadeSpeed);
                }
                // Screen-space left-edge opacity mask: letters fade linearly
                // from 0 at x=0 to full alpha at x=edgeFadeLeft. Acts like a
                // gradient wipe on the left side of the output — letters smoothly
                // disappear as they exit left regardless of spline shape.
                if (P.edgeFadeLeft > 0 && pos.x < P.edgeFadeLeft) {
                    alpha *= Math.max(0, pos.x / P.edgeFadeLeft);
                }

                alpha = Math.max(0, Math.min(1, alpha));
                if (alpha <= 0) continue;

                const r = Math.round(lerp(P.colorStartR, P.colorEndR, linearT));
                const g = Math.round(lerp(P.colorStartG, P.colorEndG, linearT));
                const b = Math.round(lerp(P.colorStartB, P.colorEndB, linearT));

                const depthT = Math.min(t / P.depthFullAt, 1.0);
                const tA = Math.pow(depthT, P.depthEaseIn);
                const depthEased = tA / (tA + Math.pow(1 - depthT, P.depthEaseOut));
                const scale = lerp(P.depthScale, 1.0, depthEased);
                let size = P.charSize * scale;

                // Auto-scale: use local spline speed × easing derivative for smooth sizing
                let autoScaledSize = size;
                if (doAutoScale && p.totalChars > 1 && p.segDuration > 0) {
                    const spawnGap = p.segDuration / p.totalChars;
                    // Local spline speed (pixels per unit t) using remapped positions
                    const eps = 0.002;
                    const asArc = (seg && seg._splineArcData) ? seg._splineArcData : (p._arcData || (p._arcData = buildArcTable(p)));
                    const asP   = (seg && seg._splineP) ? seg._splineP : p;
                    const posTSample = remapToArcLength(asArc, Math.min(tWithGap + eps, 1.0));
                    const posSample = getParticlePos(asP, posTSample);
                    const splineSpeed = Math.sqrt(
                        (posSample.x - splinePos.x) ** 2 + (posSample.y - splinePos.y) ** 2
                    ) / Math.max(eps, 0.0001);

                    // Correct derivative for easeBlended: easeOutQuad portion
                    // uses 2(1-x), but after linearBlend it's constant
                    const easingDeriv = linearT <= P.linearBlend
                        ? 2 * (1 - linearT)
                        : 2 * (1 - P.linearBlend);
                    // t-gap between consecutive chars
                    const linearTGap = (spawnGap * fontSpeedScale) / P.charLifetime;
                    const expectedSpacing = splineSpeed * easingDeriv * linearTGap;

                    if (expectedSpacing > 0) {
                        // Smoothly scale: size tracks spacing with no hard threshold.
                        // When spacing is abundant, min() keeps full size unchanged.
                        // As spacing shrinks, size shrinks proportionally.
                        autoScaledSize = Math.max(
                            Math.min(size, expectedSpacing * 0.85),
                            P.charSize * P.minCharScale
                        );
                    }

                    // Accumulate for per-segment average
                    const sid = p.segIdx;
                    if (!segSizes[sid]) segSizes[sid] = { sum: 0, count: 0 };
                    segSizes[sid].sum += autoScaledSize;
                    segSizes[sid].count++;
                }

                const spellShrink = 1;

                // Kept letters swap to their final-spelling character once the
                // transition fully completes. Duplicates always show their
                // phonetic char (until they fade).
                const displayChar = (p.isKept && p.finalChar && spellTransProgress >= 1)
                    ? p.finalChar : p.char;

                renderData.push({ p, pos, noiseVal, alpha, r, g, b, size, autoScaledSize, spellShrink, displayChar, t, linearT });
            }

            // Smooth the per-segment averages over time to prevent jumps
            for (const sid in segSizes) {
                const rawAvg = segSizes[sid].sum / segSizes[sid].count;
                if (segAvgSmoothed[sid] === undefined) {
                    segAvgSmoothed[sid] = rawAvg;
                } else {
                    segAvgSmoothed[sid] = lerp(segAvgSmoothed[sid], rawAvg, 0.08);
                }
            }
            // Clean up segments no longer visible
            for (const sid in segAvgSmoothed) {
                if (!segSizes[sid]) delete segAvgSmoothed[sid];
            }

            // Pass 2: render with uniform per-segment sizing
            for (const d of renderData) {
                let size = d.size;
                if (doAutoScale && d.p.totalChars > 1 && d.p.segDuration > 0) {
                    const sid = d.p.segIdx;
                    if (segAvgSmoothed[sid] !== undefined) {
                        const avgSize = segAvgSmoothed[sid];
                        // Smoothly blend from natural depth-scaled size to uniform average
                        const blend = Math.min(d.t / P.scaleNormAt, 1.0);
                        size = lerp(d.size, avgSize, blend);
                    }
                    // Never exceed the per-char auto-scaled size — prevents
                    // segment averaging from undoing overlap-prevention shrinking
                    size = Math.min(size, d.autoScaledSize);
                }
                size *= d.spellShrink;

                ctx.save();
                ctx.globalAlpha = d.alpha;
                ctx.font = `bold ${size}px 'Helvetica Neue', Arial, sans-serif`;
                ctx.fillStyle = `rgb(${d.r},${d.g},${d.b})`;
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fillText(d.displayChar, d.pos.x, d.pos.y + d.noiseVal);
                ctx.restore();
            }
        }

        // ─── Main loop ───
        let lastFaceDetect = 0;
        const FACE_DETECT_INTERVAL = 50;

        function animate(timestamp) {
            if (!running) return;
            syncCanvasSize();
            drawWarpedVideo();
            if (showInputGrid) renderInputGrid();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (timestamp - lastFaceDetect > FACE_DETECT_INTERVAL) {
                detectFace(timestamp);
                lastFaceDetect = timestamp;
            }

            // Blackout: paint over camera feed after detection has used it
            if (blackoutMode) {
                dispCtx.fillStyle = '#000';
                dispCtx.fillRect(0, 0, dispCanvas.width, dispCanvas.height);
            }

            if (!audio.paused) {
                const syncTime = audio.currentTime + P.syncOffset;
                updateLyricSpawning(syncTime + P.mouthSyncOffset);
                updateSubtitle(syncTime);
            }

            if (showSplineViz) renderSplineViz();
            renderParticles(timestamp);
            renderSubtitle();

            // Mouth dot (toggle via button)
            if (hasFace && showTrackingDot) {
                ctx.save();
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.arc(mouthX, mouthY, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ff88cc';
                ctx.fill();
                ctx.restore();
            }

            applyOutputWarp();
            if (showOutputGrid) renderOutputGrid();
            if (calibMode && !calibDragging) updateCalibCorners();

            requestAnimationFrame(animate);
        }

        // ─── Startup ───
        async function init() {
            await loadParams();
            buildTweaksUI();
            try {
                await Promise.all([loadLyrics(), initFaceLandmarker(), initPoseLandmarker()]);
            } catch (e) {
                log('Error loading: ' + e.message);
                console.error(e);
            }
            try {
                await startCamera(P.cameraDeviceId || undefined);
                await populateCameraSelect();
            } catch (e) { log('Camera error: ' + e.message); console.error(e); }
            startBtn.disabled = false;
            startBtn.textContent = 'Click to Start';
            log('Ready');
        }

        // ─── "1" key: toggle clean mode (hide UI + webcam, black background) ───
        let cleanMode = true;

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            running = true;
            // Apply default clean mode
            dispCanvas.style.display = 'none';
            tweaksToggle.style.display = 'none';
            statusEl.style.display = 'none';
            // Debug: playback rate via ?rate=N (e.g. ?rate=4 for 4x speed,
            // lets us get to interesting sections quickly without seeking).
            const rateMatch = location.search.match(/[?&]rate=([0-9.]+)/);
            if (rateMatch) audio.playbackRate = parseFloat(rateMatch[1]);
            audio.play().catch(e => log('Audio play error: ' + e.message));
            requestAnimationFrame(animate);
        });
        function toggleCleanMode() {
            cleanMode = !cleanMode;
            dispCanvas.style.display = cleanMode ? 'none' : '';
            tweaksToggle.style.display = cleanMode ? 'none' : '';
            tweaksPanel.classList.remove('open');
            tweaksPanel.style.display = cleanMode ? 'none' : '';
            statusEl.style.display = cleanMode ? 'none' : '';
        }
        document.addEventListener('keydown', (e) => {
            // Arrow key nudge for calibration
            if (calibMode && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const step = e.ctrlKey || e.metaKey ? P.calibNudge * 4 : e.shiftKey ? P.calibNudge * 0.25 : P.calibNudge;
                const c = calibSelectedCorner;
                const keyMap = getCalibKeyMap();
                const kx = keyMap[c][0], ky = keyMap[c][1];
                if (e.key === 'ArrowLeft')  P[kx] -= step;
                if (e.key === 'ArrowRight') P[kx] += step;
                if (e.key === 'ArrowUp')    P[ky] -= step;
                if (e.key === 'ArrowDown')  P[ky] += step;
                // Sync UI
                for (const k of [kx, ky]) {
                    const slider = tweaksPanel.querySelector(`input[type="range"][data-key="${k}"]`);
                    const numInp = document.getElementById('val-' + k);
                    if (slider) slider.value = P[k];
                    if (numInp) numInp.value = P[k].toFixed(2);
                }
                updateCalibCorners();
                return;
            }
            // Arrow key nudge for tracking offset when dot is shown
            if (showTrackingDot && !calibMode && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const step = e.ctrlKey || e.metaKey ? 10 : e.shiftKey ? 1 : 5;
                if (e.key === 'ArrowLeft')  P.trackOffsetX -= step;
                if (e.key === 'ArrowRight') P.trackOffsetX += step;
                if (e.key === 'ArrowUp')    P.trackOffsetY -= step;
                if (e.key === 'ArrowDown')  P.trackOffsetY += step;
                // Sync UI
                for (const k of ['trackOffsetX', 'trackOffsetY']) {
                    const slider = tweaksPanel.querySelector(`input[type="range"][data-key="${k}"]`);
                    const numInp = document.getElementById('val-' + k);
                    if (slider) slider.value = P[k];
                    if (numInp) numInp.value = P[k];
                }
                return;
            }
            if (e.key === '1') {
                toggleCleanMode();
            }
            if (e.key === 'd' || e.key === 'D') {
                debugMode = !debugMode;
                log('Debug mode: ' + (debugMode ? 'ON' : 'OFF'));
            }
            if (e.key === 'p' || e.key === 'P') {
                // Toggle params-only mode: show tweaks panel without camera feed
                const isOpen = tweaksPanel.style.display !== 'none';
                if (isOpen) {
                    tweaksPanel.style.display = 'none';
                    tweaksPanel.classList.remove('open');
                    tweaksToggle.style.display = 'none';
                } else {
                    tweaksPanel.style.display = '';
                    tweaksPanel.classList.add('open');
                    tweaksToggle.style.display = '';
                    // Keep camera feed hidden
                    dispCanvas.style.display = 'none';
                    statusEl.style.display = 'none';
                }
            }
            if (e.key === 'o' || e.key === 'O') {
                blackoutMode = !blackoutMode;
            }
            if (e.key === '2') {
                // Restart song from the beginning
                audio.currentTime = 0;
                particles = [];
                lastSegmentIndex = -1;
                charSpawnIndex = 0;
                subtitleBox.innerHTML = '';
                if (audio.paused && running) {
                    audio.play().catch(err => log('Audio error: ' + err.message));
                }
                log('Restarted');
            }
        });

        init();
    </script>
</body>
</html>
