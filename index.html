<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Face Track</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Georgia', serif;
            color: #fff;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #webcam {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            cursor: pointer;
        }
        #startScreen h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(255,200,100,0.5);
        }
        #startScreen p {
            font-size: 1.3rem;
            opacity: 0.7;
            margin-bottom: 2rem;
        }
        #startBtn {
            font-size: 1.5rem;
            padding: 1rem 3rem;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
        }
        #startBtn:hover {
            background: rgba(255,255,255,0.25);
            border-color: #fff;
        }
        #startBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
            z-index: 150;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 4px;
        }
        #lyrics-display {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            text-align: center;
            opacity: 0.35;
            max-width: 80%;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="lyrics-display"></div>
        <div id="status">Loading...</div>
        <div id="startScreen">
            <h1>Karaoke Face Track</h1>
            <p>Hallelujah &mdash; Leonard Cohen</p>
            <button id="startBtn" disabled>Loading...</button>
        </div>
    </div>

    <script type="module">
        // ─── MediaPipe imports ───
        import { FaceLandmarker, FilesetResolver } from
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

        // ─── DOM refs ───
        const video       = document.getElementById('webcam');
        const canvas      = document.getElementById('overlay');
        const ctx         = canvas.getContext('2d');
        const statusEl    = document.getElementById('status');
        const lyricsEl    = document.getElementById('lyrics-display');
        const startScreen = document.getElementById('startScreen');
        const startBtn    = document.getElementById('startBtn');

        // ─── Audio setup ───
        const audio = new Audio('Hallelujah_-_Leonard_Cohen_Karaoke_Version_KaraFun.wav');
        audio.preload = 'auto';

        // ─── State ───
        let faceLandmarker   = null;
        let lyricsData       = [];
        let activeChars      = [];
        let mouthX = 0, mouthY = 0;
        let hasFace          = false;
        let lastSegmentIndex = -1;
        let charSpawnIndex   = 0;
        let running          = false;
        let lastDetectTs     = -1;   // for strictly increasing timestamps

        // ─── Config ───
        const CHAR_LIFETIME  = 3.0;
        const CHAR_SIZE      = 38;
        const DRIFT_X        = -220;
        const DRIFT_Y        = -280;
        const NOISE_AMP      = 8;
        const NOISE_FREQ     = 3.5;
        const FADE_START     = 0.55;
        const CHAR_SPACING   = 18;
        const SPLINE_CURVE   = 0.3;

        function log(msg) {
            console.log('[Karaoke]', msg);
            statusEl.textContent = msg;
        }

        // ─── Parse time "M.SS.F" → seconds ───
        function parseTime(timeStr) {
            const cleaned = timeStr.replace(/\s/g, '');
            const parts = cleaned.split('.');
            if (parts.length < 3) return 0;
            const minutes = parseInt(parts[0], 10) || 0;
            const seconds = parseInt(parts[1], 10) || 0;
            const tenths  = parseInt(parts[2], 10) || 0;
            return minutes * 60 + seconds + tenths * 0.1;
        }

        // ─── Load lyrics ───
        async function loadLyrics() {
            log('Loading lyrics...');
            const resp = await fetch('Hallelujah.json');
            const raw  = await resp.json();
            lyricsData = raw.map((item, i) => {
                const seg  = item.segments[0];
                const text = seg.text || seg.finalWord || '';
                return {
                    index: i,
                    text: text.trim(),
                    start: parseTime(seg.startTime),
                    end:   parseTime(seg.endTime),
                };
            });
            log(`Loaded ${lyricsData.length} lyric segments`);
        }

        // ─── Init MediaPipe ───
        async function initFaceLandmarker() {
            log('Loading face model...');
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
            );

            // Try GPU first, fall back to CPU
            for (const delegate of ["GPU", "CPU"]) {
                try {
                    log(`Trying face model with ${delegate}...`);
                    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                            delegate
                        },
                        runningMode: "VIDEO",
                        numFaces: 1,
                        outputFaceBlendshapes: false,
                        outputFacialTransformationMatrixes: false,
                    });
                    log(`Face model loaded (${delegate})`);
                    return;
                } catch (e) {
                    console.warn(`${delegate} delegate failed:`, e);
                    if (delegate === "CPU") throw e;
                }
            }
        }

        // ─── Start webcam ───
        async function startCamera() {
            log('Requesting camera...');
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
            });
            video.srcObject = stream;

            await new Promise((resolve, reject) => {
                video.onloadedmetadata = resolve;
                video.onerror = reject;
                setTimeout(() => reject(new Error('Camera timeout')), 10000);
            });
            await video.play();
            log('Camera ready');
        }

        // ─── Resize canvas to match its CSS layout size ───
        function syncCanvasSize() {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
                canvas.width  = w;
                canvas.height = h;
            }
        }

        // ─── Detect face ───
        function detectFace(timestamp) {
            if (!faceLandmarker) return;

            // detectForVideo requires strictly increasing integer timestamps
            const ts = Math.round(timestamp);
            if (ts <= lastDetectTs) return;
            lastDetectTs = ts;

            try {
                const results = faceLandmarker.detectForVideo(video, ts);
                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    const lm = results.faceLandmarks[0];
                    const upper = lm[13];
                    const lower = lm[14];
                    // Mirror X because video is CSS-mirrored
                    const normX = 1.0 - (upper.x + lower.x) / 2;
                    const normY = (upper.y + lower.y) / 2;
                    mouthX = normX * canvas.width;
                    mouthY = normY * canvas.height;
                    hasFace = true;
                } else {
                    hasFace = false;
                }
            } catch (e) {
                console.warn('Face detect error:', e);
            }
        }

        // ─── Pseudo-noise ───
        function noise(t, seed) {
            return Math.sin(t * 2.1 + seed * 1.7) * 0.5
                 + Math.sin(t * 4.3 + seed * 3.1) * 0.3
                 + Math.sin(t * 7.7 + seed * 0.3) * 0.2;
        }

        // ─── Spawn characters for the current lyric segment ───
        function updateLyricSpawning(currentTime) {
            let currentSeg    = null;
            let currentSegIdx = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].start && currentTime < lyricsData[i].end) {
                    currentSeg    = lyricsData[i];
                    currentSegIdx = i;
                    break;
                }
            }

            if (currentSeg) {
                lyricsEl.textContent = currentSeg.text;
            } else {
                lyricsEl.textContent = '';
            }

            if (currentSegIdx !== lastSegmentIndex) {
                lastSegmentIndex = currentSegIdx;
                charSpawnIndex   = 0;
            }

            if (!currentSeg || !hasFace) return;

            const text = currentSeg.text;
            if (!text || text.length === 0) return;

            const segDuration  = currentSeg.end - currentSeg.start;
            if (segDuration <= 0) return;
            const elapsed      = currentTime - currentSeg.start;
            const charsToSpawn = Math.floor((elapsed / segDuration) * text.length);

            while (charSpawnIndex < charsToSpawn && charSpawnIndex < text.length) {
                const ch = text[charSpawnIndex];
                const jitterX = (Math.random() - 0.5) * 6;
                const jitterY = (Math.random() - 0.5) * 6;
                activeChars.push({
                    char: ch,
                    birthTime: performance.now() / 1000,
                    startX: mouthX + jitterX,
                    startY: mouthY + jitterY,
                    seed: Math.random() * 100,
                    index: charSpawnIndex,
                    offsetX: charSpawnIndex * CHAR_SPACING * 0.15,
                });
                charSpawnIndex++;
            }
        }

        // ─── Char position along spline ───
        function getCharPos(ch, t) {
            const sx = ch.startX;
            const sy = ch.startY;
            const cx = sx + DRIFT_X * SPLINE_CURVE + ch.offsetX;
            const cy = sy + DRIFT_Y * 0.6;
            const ex = sx + DRIFT_X + ch.offsetX * 2;
            const ey = sy + DRIFT_Y;

            const u = 1 - t;
            const x = u * u * sx + 2 * u * t * cx + t * t * ex;
            const y = u * u * sy + 2 * u * t * cy + t * t * ey;
            const noiseVal = noise(t * NOISE_FREQ, ch.seed) * NOISE_AMP;

            return { x, y: y + noiseVal };
        }

        // ─── Render floating chars ───
        function renderChars(nowMs) {
            const nowSec = nowMs / 1000;
            activeChars = activeChars.filter(ch => (nowSec - ch.birthTime) < CHAR_LIFETIME);

            for (const ch of activeChars) {
                const age = nowSec - ch.birthTime;
                const t   = Math.min(age / CHAR_LIFETIME, 1.0);
                const pos = getCharPos(ch, t);

                let alpha = 1.0;
                if (t < 0.05) {
                    alpha = t / 0.05;
                } else if (t > FADE_START) {
                    alpha = 1.0 - (t - FADE_START) / (1.0 - FADE_START);
                }
                alpha = Math.max(0, Math.min(1, alpha));

                const scale = 1.0 - t * 0.3;
                const size  = CHAR_SIZE * scale;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = `bold ${size}px Georgia, serif`;
                ctx.fillStyle = '#fff';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                ctx.fillText(ch.char, pos.x, pos.y);
                ctx.restore();
            }
        }

        // ─── Main loop ───
        let lastFaceDetect = 0;
        const FACE_DETECT_INTERVAL = 50; // ~20fps for detection (lighter)

        function animate(timestamp) {
            if (!running) return;

            syncCanvasSize();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (timestamp - lastFaceDetect > FACE_DETECT_INTERVAL) {
                detectFace(timestamp);
                lastFaceDetect = timestamp;
            }

            if (!audio.paused) {
                updateLyricSpawning(audio.currentTime);
            }

            renderChars(timestamp);

            // Subtle mouth indicator
            if (hasFace) {
                ctx.save();
                ctx.globalAlpha = 0.15;
                ctx.beginPath();
                ctx.arc(mouthX, mouthY, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        // ─── Startup ───
        async function init() {
            try {
                // Load lyrics and face model in parallel
                await Promise.all([loadLyrics(), initFaceLandmarker()]);
            } catch (e) {
                log('Error loading models: ' + e.message);
                console.error(e);
                // Continue anyway — camera/lyrics may still work
            }

            try {
                await startCamera();
            } catch (e) {
                log('Camera error: ' + e.message);
                console.error(e);
            }

            startBtn.disabled = false;
            startBtn.textContent = 'Click to Start';
            log('Ready');
        }

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            running = true;
            audio.play().catch(e => {
                log('Audio play error: ' + e.message);
                console.error(e);
            });
            requestAnimationFrame(animate);
            log('Playing...');
        });

        init();
    </script>
</body>
</html>
