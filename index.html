<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #webcam {
            display: none;
        }
        #webcam-display {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 100;
        }
        #startScreen h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(255,200,100,0.5);
        }
        #startScreen p {
            font-size: 1.3rem;
            opacity: 0.7;
            margin-bottom: 2rem;
        }
        #startBtn {
            font-size: 1.5rem;
            padding: 1rem 3rem;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #startBtn:hover { background: rgba(255,255,255,0.25); border-color: #fff; }
        #startBtn:disabled { opacity: 0.4; cursor: not-allowed; }
        #status {
            position: absolute;
            top: 12px; left: 12px;
            font-size: 0.75rem;
            opacity: 0.45;
            z-index: 150;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* ─── Subtitle box (hidden — now canvas-rendered) ─── */
        #subtitle-box { display: none; }

        /* ─── Tweaks panel ─── */
        #tweaks-toggle {
            position: absolute;
            top: 12px; right: 12px;
            z-index: 200;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: sans-serif;
        }
        #tweaks-toggle:hover { background: rgba(255,255,255,0.15); }
        #tweaks-panel {
            position: absolute;
            top: 44px; right: 12px;
            z-index: 200;
            background: rgba(15, 15, 20, 0.92);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 16px 20px;
            width: 460px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
            font-family: sans-serif;
            font-size: 0.78rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #tweaks-panel.open { display: block; }
        #tweaks-panel h3 {
            margin: 12px 0 6px 0;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
        }
        #tweaks-panel h3:first-child { margin-top: 0; }
        .tweak-row {
            display: flex;
            align-items: center;
            margin: 5px 0;
            gap: 8px;
        }
        .tweak-row label {
            flex: 0 0 100px;
            opacity: 0.8;
        }
        .tweak-row input[type="range"] {
            flex: 1;
            accent-color: #88aaff;
        }
        .tweak-row input[type="number"] {
            flex: 0 0 62px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 4px;
            color: #fff;
            text-align: left;
            font-size: 0.75rem;
            font-family: monospace;
            padding: 3px 6px;
            -moz-appearance: textfield;
        }
        .tweak-row input[type="number"]::-webkit-inner-spin-button,
        .tweak-row input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }
        .tweak-btn {
            width: 100%;
            margin: 10px 0 4px 0;
            padding: 6px 0;
            background: rgba(136,170,255,0.15);
            border: 1px solid rgba(136,170,255,0.4);
            color: #88aaff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            font-family: sans-serif;
        }
        .tweak-btn:hover { background: rgba(136,170,255,0.25); }
        .tweak-select {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 4px;
            color: #fff;
            font-size: 0.78rem;
            font-family: sans-serif;
            padding: 5px 8px;
            margin: 4px 0 8px 0;
        }
        .tweak-select option { background: #1a1a2e; color: #fff; }
        .tweak-accordion {
            margin: 8px 0 4px 0;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            overflow: hidden;
        }
        .tweak-accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(255,255,255,0.06);
            cursor: pointer;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            user-select: none;
        }
        .tweak-accordion-header:hover { opacity: 1; }
        .tweak-accordion-header::after {
            content: '▸';
            transition: transform 0.2s;
        }
        .tweak-accordion.open .tweak-accordion-header::after {
            transform: rotate(90deg);
        }
        .tweak-accordion-body {
            display: none;
            padding: 6px 10px;
        }
        .tweak-accordion.open .tweak-accordion-body {
            display: block;
        }
        /* ─── Calibration overlay ─── */
        .calib-corner {
            position: absolute;
            width: 24px; height: 24px;
            border: 2px solid #0f0;
            border-radius: 50%;
            background: rgba(0,255,0,0.25);
            cursor: grab;
            z-index: 180;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        .calib-corner.active { border-color: #ff0; background: rgba(255,255,0,0.35); }
        .calib-corner:hover { background: rgba(0,255,0,0.5); }
        .calib-corner.output-mode { border-color: #88aaff; background: rgba(136,170,255,0.25); }
        .calib-corner.output-mode:hover { background: rgba(136,170,255,0.5); }
        .calib-corner.output-mode.active { border-color: #ff0; background: rgba(255,255,0,0.35); }
        .calib-label {
            position: absolute;
            color: #0f0;
            font-size: 0.65rem;
            font-family: monospace;
            pointer-events: none;
            z-index: 181;
            text-shadow: 0 0 3px #000, 0 0 6px #000;
            transform: translate(-50%, 14px);
        }
        .calib-label.output-mode { color: #88aaff; }
        .calib-label.active { color: #ff0; }
        #calib-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 175;
            pointer-events: none;
            display: none;
        }
        #calib-overlay.active { display: block; }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="webcam-display"></canvas>
        <canvas id="overlay"></canvas>
        <div id="subtitle-box"></div>
        <div id="calib-overlay"></div>
        <div id="status">Loading...</div>
        <button id="tweaks-toggle">Parameters</button>
        <div id="tweaks-panel"></div>
        <div id="startScreen">
            <h1>Musikase</h1>
            <p>Hallelujah &mdash; Leonard Cohen</p>
            <button id="startBtn" disabled>Loading...</button>
        </div>
    </div>

    <script type="module">
        import { FaceLandmarker, PoseLandmarker, FilesetResolver } from
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

        // ─── DOM ───
        const video       = document.getElementById('webcam');
        const dispCanvas  = document.getElementById('webcam-display');
        const dispCtx     = dispCanvas.getContext('2d');
        const canvas      = document.getElementById('overlay');
        const ctx         = canvas.getContext('2d');
        // Offscreen canvas for rendering particles before output warp
        const offCanvas   = document.createElement('canvas');
        const offCtx      = offCanvas.getContext('2d');
        const statusEl    = document.getElementById('status');
        const subtitleBox = document.getElementById('subtitle-box');
        const startScreen = document.getElementById('startScreen');
        const startBtn    = document.getElementById('startBtn');
        const tweaksToggle = document.getElementById('tweaks-toggle');
        const tweaksPanel  = document.getElementById('tweaks-panel');

        // ─── Audio ───
        const audio = new Audio('Hallelujah_-_Leonard_Cohen_Karaoke_Version_KaraFun.wav');
        audio.preload = 'auto';

        // ─── Tweakable params ───
        // Hardcoded fallback defaults
        const P_HARDCODED = {
            charSize:80, charLifetime:4, noiseAmp:7, noiseFreq:2.5,
            mouthSmooth:0.8, fadeInStart:0, fadeInEnd:0.12,
            cpPull1:-0.5, cpPull2:0.19, cpCurve:0.48,
            targetX:0, targetY:0.2,
            colorStartR:255, colorStartG:255, colorStartB:255,
            colorEndR:220, colorEndG:50, colorEndB:50,
            burstDistance:300, burstDuration:0.3, targetNoise:60,
            fadeStart:0.8, fadeEnd:0.97, syncOffset:0,
            subX:0, subY:40, subScale:1, subMaxWidth:600,
            imgScale:1, imgX:0, imgY:0, imgRotation:0,
            ksTLx:0, ksTLy:0, ksTRx:0, ksTRy:0,
            ksBLx:0, ksBLy:0, ksBRx:0, ksBRy:0,
            // Output keystone
            outTLx:0, outTLy:0, outTRx:0, outTRy:0,
            outBLx:0, outBLy:0, outBRx:0, outBRy:0,
            outScale:1, outImgX:0, outImgY:0, outRotation:0,
            lyricsFlipped: true,
            cameraMirrored: false,
            calibNudge: 0.5,
            cameraDeviceId: '',
        };

        // Load defaults from params.json (persists across server restarts)
        let P_DEFAULTS = { ...P_HARDCODED };
        const P = { ...P_HARDCODED };

        async function loadParams() {
            try {
                const res = await fetch('params.json?' + Date.now());
                if (res.ok) {
                    const saved = await res.json();
                    Object.assign(P_DEFAULTS, saved);
                    Object.assign(P, P_DEFAULTS);
                }
            } catch (e) { console.warn('Could not load params.json:', e); }
        }

        // ─── Build tweaks UI ───
        function buildTweaksUI() {
            const defs = [
                { accordion: 'Particles' },
                { key: 'charSize',     label: 'Font size',     min: 16, max: 200, step: 1 },
                { key: 'charLifetime', label: 'Lifetime (s)',  min: 1,  max: 10, step: 0.1 },
                { key: 'noiseAmp',     label: 'Noise amp',     min: 0,  max: 30, step: 0.5 },
                { key: 'noiseFreq',    label: 'Noise freq',    min: 0.5, max: 8, step: 0.1 },
                { key: 'fadeInStart',  label: 'Fade-in start', min: 0, max: 0.5, step: 0.01 },
                { key: 'fadeInEnd',    label: 'Fade-in end',   min: 0.01, max: 0.5, step: 0.01 },
                { key: 'fadeStart',   label: 'Fade-out start', min: 0.1, max: 0.9, step: 0.01 },
                { key: 'fadeEnd',     label: 'Fade-out end',   min: 0.3, max: 1.0, step: 0.01 },
                { accordionEnd: true },
                { accordion: 'Burst' },
                { key: 'burstDistance', label: 'Burst dist (px)', min: 10, max: 600, step: 5 },
                { key: 'burstDuration', label: 'Burst time %',    min: 0.02, max: 0.6, step: 0.01 },
                { accordionEnd: true },
                { accordion: 'Spline Shape' },
                { key: 'cpPull1',      label: 'CP1 pull',      min: -1.5, max: 2.0, step: 0.01 },
                { key: 'cpPull2',      label: 'CP2 pull',      min: -1.5, max: 2.0, step: 0.01 },
                { key: 'cpCurve',      label: 'Curvature',     min: -0.5, max: 0.5, step: 0.01 },
                { key: 'targetX',      label: 'Target X %',    min: 0, max: 0.4, step: 0.01 },
                { key: 'targetY',      label: 'Target Y %',    min: 0, max: 0.4, step: 0.01 },
                { key: 'targetNoise',  label: 'End noise',     min: 0, max: 60, step: 1 },
                { button: 'spline-viz-btn', label: 'Show Spline Path' },
                { accordionEnd: true },
                { accordion: 'Tracking' },
                { key: 'mouthSmooth',  label: 'Smoothing',     min: 0, max: 0.95, step: 0.01 },
                { accordionEnd: true },
                { accordion: 'Sync' },
                { key: 'syncOffset',   label: 'Offset (s)',    min: -5, max: 5, step: 0.05 },
                { accordionEnd: true },
                { accordion: 'End Color (RGB)' },
                { key: 'colorEndR',    label: 'Red',           min: 0, max: 255, step: 1 },
                { key: 'colorEndG',    label: 'Green',         min: 0, max: 255, step: 1 },
                { key: 'colorEndB',    label: 'Blue',          min: 0, max: 255, step: 1 },
                { accordionEnd: true },
                { accordion: 'Subtitle Position' },
                { key: 'subX',         label: 'Offset X (px)', min: -500, max: 500, step: 1 },
                { key: 'subY',         label: 'Bottom (px)',   min: 0, max: 500, step: 1 },
                { key: 'subScale',     label: 'Scale',         min: 0.3, max: 3.0, step: 0.05 },
                { key: 'subMaxWidth',  label: 'Max width (px)', min: 100, max: 1600, step: 10 },
                { accordionEnd: true },
                { accordion: 'Image Transform' },
                { key: 'imgScale',     label: 'Scale',          min: 0.1, max: 3.0, step: 0.05 },
                { key: 'imgX',         label: 'Position X (px)', min: -1000, max: 1000, step: 1 },
                { key: 'imgY',         label: 'Position Y (px)', min: -1000, max: 1000, step: 1 },
                { key: 'imgRotation',  label: 'Rotation (deg)',  min: -180, max: 180, step: 0.5 },
                { accordionEnd: true },
                { accordion: 'Camera Input Keystone' },
                { key: 'ksTLx',        label: 'TL X %',        min: -50, max: 50, step: 0.5 },
                { key: 'ksTLy',        label: 'TL Y %',        min: -50, max: 50, step: 0.5 },
                { key: 'ksTRx',        label: 'TR X %',        min: -50, max: 50, step: 0.5 },
                { key: 'ksTRy',        label: 'TR Y %',        min: -50, max: 50, step: 0.5 },
                { key: 'ksBLx',        label: 'BL X %',        min: -50, max: 50, step: 0.5 },
                { key: 'ksBLy',        label: 'BL Y %',        min: -50, max: 50, step: 0.5 },
                { key: 'ksBRx',        label: 'BR X %',        min: -50, max: 50, step: 0.5 },
                { key: 'ksBRy',        label: 'BR Y %',        min: -50, max: 50, step: 0.5 },
                { accordionEnd: true },
                { accordion: 'Output Warp' },
                { key: 'outTLx',       label: 'TL X %',        min: -50, max: 50, step: 0.5 },
                { key: 'outTLy',       label: 'TL Y %',        min: -50, max: 50, step: 0.5 },
                { key: 'outTRx',       label: 'TR X %',        min: -50, max: 50, step: 0.5 },
                { key: 'outTRy',       label: 'TR Y %',        min: -50, max: 50, step: 0.5 },
                { key: 'outBLx',       label: 'BL X %',        min: -50, max: 50, step: 0.5 },
                { key: 'outBLy',       label: 'BL Y %',        min: -50, max: 50, step: 0.5 },
                { key: 'outBRx',       label: 'BR X %',        min: -50, max: 50, step: 0.5 },
                { key: 'outBRy',       label: 'BR Y %',        min: -50, max: 50, step: 0.5 },
                { accordionEnd: true },
                { accordion: 'Output Transform' },
                { key: 'outScale',     label: 'Scale',          min: 0.1, max: 3.0, step: 0.05 },
                { key: 'outImgX',      label: 'Position X (px)', min: -1000, max: 1000, step: 1 },
                { key: 'outImgY',      label: 'Position Y (px)', min: -1000, max: 1000, step: 1 },
                { key: 'outRotation',  label: 'Rotation (deg)',  min: -180, max: 180, step: 0.5 },
                { accordionEnd: true },
            ];

            // Camera selector
            let html = '<h3>Camera</h3><select class="tweak-select" id="camera-select"><option value="">Loading cameras...</option></select>';
            for (const d of defs) {
                if (d.accordion) {
                    html += `<div class="tweak-accordion"><div class="tweak-accordion-header">${d.accordion}</div><div class="tweak-accordion-body">`;
                    continue;
                }
                if (d.accordionEnd) {
                    html += `</div></div>`;
                    continue;
                }
                if (d.button) {
                    html += `<button class="tweak-btn" id="${d.button}" style="margin:6px 0">${d.label}</button>`;
                    continue;
                }
                const displayVal = Number.isInteger(P[d.key]) ? P[d.key] : P[d.key].toFixed(2);
                html += `<div class="tweak-row">
                    <label>${d.label}</label>
                    <input type="range" data-key="${d.key}" min="${d.min}" max="${d.max}" step="${d.step}" value="${P[d.key]}">
                    <input type="number" data-key="${d.key}" id="val-${d.key}" step="${d.step}" value="${displayVal}">
                </div>`;
            }
            html += `<div style="display:flex;gap:6px;margin:10px 0 4px 0"><button class="tweak-btn" id="play-btn" style="margin:0;flex:1">Play</button><button class="tweak-btn" id="pause-btn" style="margin:0;flex:1">Pause</button><button class="tweak-btn" id="restart-btn" style="margin:0;flex:1">Restart</button></div>`;
            html += `<button class="tweak-btn" id="flip-lyrics-btn">Flip Lyrics Horizontally</button>`;
            html += `<button class="tweak-btn" id="mirror-cam-btn">${P.cameraMirrored ? 'Unmirror Camera' : 'Mirror Camera'}</button>`;
            html += `<button class="tweak-btn" id="calibrate-btn">Calibrate Camera</button>`;
            html += `<button class="tweak-btn" id="calibrate-out-btn">Calibrate Output</button>`;
            html += `<div id="calib-controls" style="display:none;margin:6px 0">`;
            html += `<div class="tweak-row"><label>Arrow nudge</label><select class="tweak-select" id="calib-corner-select" style="margin:0;flex:1">`;
            html += `<option value="TL">Top-Left</option><option value="TR">Top-Right</option>`;
            html += `<option value="BL">Bottom-Left</option><option value="BR">Bottom-Right</option>`;
            html += `</select></div>`;
            html += `<div class="tweak-row"><label>Nudge step %</label><input type="range" data-key="calibNudge" min="0.05" max="5" step="0.05" value="${P.calibNudge}"><input type="number" data-key="calibNudge" id="val-calibNudge" step="0.05" value="${P.calibNudge.toFixed(2)}"></div>`;
            html += `<div style="opacity:0.5;font-size:0.7rem;margin:2px 0 4px 0">Drag corners or use arrow keys (Shift=&frac14;x, Ctrl=4x)</div>`;
            html += `</div>`;
            html += `<button class="tweak-btn" id="grid-toggle-btn">Show Output Grid</button>`;
            html += `<button class="tweak-btn" id="set-defaults-btn">Set Current as Default</button>`;
            html += `<button class="tweak-btn" id="reset-defaults-btn" style="color:#ff8888;border-color:rgba(255,136,136,0.4);background:rgba(255,136,136,0.1)">Reset to Original Defaults</button>`;
            html += `<button class="tweak-btn" id="hide-ui-btn" style="color:#ffcc66;border-color:rgba(255,204,102,0.4);background:rgba(255,204,102,0.1)">Hide UI (Press 1)</button>`;
            tweaksPanel.innerHTML = html;

            // Accordion toggle
            tweaksPanel.querySelectorAll('.tweak-accordion-header').forEach(hdr => {
                hdr.addEventListener('click', () => {
                    hdr.parentElement.classList.toggle('open');
                });
            });

            // Sync slider → number input
            tweaksPanel.querySelectorAll('input[type="range"]').forEach(inp => {
                inp.addEventListener('input', () => {
                    const key = inp.dataset.key;
                    P[key] = parseFloat(inp.value);
                    const numInp = document.getElementById('val-' + key);
                    numInp.value = Number.isInteger(P[key]) ? P[key] : P[key].toFixed(2);
                });
            });

            // Sync number input → slider
            tweaksPanel.querySelectorAll('input[type="number"]').forEach(inp => {
                inp.addEventListener('input', () => {
                    const key = inp.dataset.key;
                    const v = parseFloat(inp.value);
                    if (isNaN(v)) return;
                    P[key] = v;
                    const slider = tweaksPanel.querySelector(`input[type="range"][data-key="${key}"]`);
                    slider.value = v;
                });
            });

            // Playback controls
            document.getElementById('play-btn').addEventListener('click', () => {
                if (running) audio.play().catch(e => log('Audio error: ' + e.message));
            });
            document.getElementById('pause-btn').addEventListener('click', () => {
                audio.pause();
            });
            document.getElementById('restart-btn').addEventListener('click', () => {
                audio.currentTime = 0;
                particles.length = 0;
                lastSegmentIndex = -1;
                charSpawnIndex = 0;
                subtitleData = null;
                if (running) audio.play().catch(e => log('Audio error: ' + e.message));
            });

            // Flip lyrics button
            document.getElementById('flip-lyrics-btn').addEventListener('click', () => {
                lyricsFlipped = !lyricsFlipped;
                P.lyricsFlipped = lyricsFlipped;
            });

            // Mirror camera button
            document.getElementById('mirror-cam-btn').addEventListener('click', () => {
                cameraMirrored = !cameraMirrored;
                P.cameraMirrored = cameraMirrored;
                document.getElementById('mirror-cam-btn').textContent = cameraMirrored ? 'Unmirror Camera' : 'Mirror Camera';
            });

            // Spline viz toggle
            document.getElementById('spline-viz-btn').addEventListener('click', () => {
                showSplineViz = !showSplineViz;
                document.getElementById('spline-viz-btn').textContent = showSplineViz ? 'Hide Spline Path' : 'Show Spline Path';
            });

            // Grid toggle button
            document.getElementById('grid-toggle-btn').addEventListener('click', () => {
                showOutputGrid = !showOutputGrid;
                document.getElementById('grid-toggle-btn').textContent = showOutputGrid ? 'Hide Output Grid' : 'Show Output Grid';
            });

            // Calibration toggle helper
            function toggleCalib(target) {
                const wasActive = calibMode && calibTarget === target;
                // Turn off any active calibration first
                calibMode = false;
                calibTarget = null;
                document.getElementById('calibrate-btn').textContent = 'Calibrate Camera';
                document.getElementById('calibrate-out-btn').textContent = 'Calibrate Output';
                document.getElementById('calib-controls').style.display = 'none';
                const overlay = document.getElementById('calib-overlay');
                overlay.classList.remove('active');
                overlay.innerHTML = '';

                if (!wasActive) {
                    calibMode = true;
                    calibTarget = target;
                    const btn = target === 'camera' ? 'calibrate-btn' : 'calibrate-out-btn';
                    document.getElementById(btn).textContent = 'Exit Calibration';
                    document.getElementById('calib-controls').style.display = '';
                    overlay.classList.add('active');
                    updateCalibCorners();
                }
            }

            document.getElementById('calibrate-btn').addEventListener('click', () => toggleCalib('camera'));
            document.getElementById('calibrate-out-btn').addEventListener('click', () => toggleCalib('output'));

            // Hide UI button
            document.getElementById('hide-ui-btn').addEventListener('click', () => {
                toggleCleanMode();
            });

            // Set current values as default
            document.getElementById('set-defaults-btn').addEventListener('click', (e) => {
                const saved = {};
                for (const d of defs) {
                    if (d.key) saved[d.key] = P[d.key];
                }
                saved.lyricsFlipped = lyricsFlipped;
                saved.cameraMirrored = cameraMirrored;
                saved.cameraDeviceId = currentDeviceId;
                // Download as params.json for user to replace in project folder
                const blob = new Blob([JSON.stringify(saved, null, 4) + '\n'], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'params.json';
                a.click();
                URL.revokeObjectURL(a.href);
                Object.assign(P_DEFAULTS, saved);
                e.target.textContent = 'Downloaded!';
                setTimeout(() => { e.target.textContent = 'Set Current as Default'; }, 1200);
            });

            // Reset to original defaults
            document.getElementById('reset-defaults-btn').addEventListener('click', () => {
                Object.assign(P, P_HARDCODED);
                Object.assign(P_DEFAULTS, P_HARDCODED);
                // Update all sliders and number inputs
                tweaksPanel.querySelectorAll('input[type="range"]').forEach(inp => {
                    const key = inp.dataset.key;
                    inp.value = P[key];
                    const numInp = document.getElementById('val-' + key);
                    numInp.value = Number.isInteger(P[key]) ? P[key] : P[key].toFixed(2);
                });
                lyricsFlipped = P.lyricsFlipped;
                cameraMirrored = P.cameraMirrored;
                if (document.getElementById('mirror-cam-btn'))
                    document.getElementById('mirror-cam-btn').textContent = cameraMirrored ? 'Unmirror Camera' : 'Mirror Camera';
            });
        }

        tweaksToggle.addEventListener('click', () => {
            tweaksPanel.classList.toggle('open');
        });

        // ─── State ───
        let lyricsFlipped    = P.lyricsFlipped;
        let cameraMirrored   = P.cameraMirrored;
        let showOutputGrid   = false;
        let showSplineViz    = false;
        let calibMode        = false;
        let calibTarget      = null; // 'camera' or 'output'
        let calibSelectedCorner = 'TL';
        let calibDragging    = null; // 'TL', 'TR', 'BL', 'BR' or null
        let faceLandmarker   = null;
        let poseLandmarker   = null;
        let lyricsData       = [];
        let running          = false;
        let lastDetectTs     = -1;
        let mouthX = 0, mouthY = 0;
        let smoothMouthX = 0, smoothMouthY = 0;
        let hasFace = false;
        let faceYaw = 0;       // -1 = facing left, +1 = facing right (screen space)
        let facePitch = 0;     // -1 = looking up, +1 = looking down
        let smoothYaw = 0;
        let smoothPitch = 0;

        // Each particle: { char, spawnTime, startX, startY, seed, burstDx, burstDy }
        let particles        = [];
        let lastSegmentIndex = -1;
        let charSpawnIndex   = 0;

        // ─── Calibration: draggable corner handles ───
        const CALIB_CORNERS = ['TL', 'TR', 'BL', 'BR'];
        const CALIB_KEY_MAPS = {
            camera: { TL: ['ksTLx','ksTLy'], TR: ['ksTRx','ksTRy'], BL: ['ksBLx','ksBLy'], BR: ['ksBRx','ksBRy'] },
            output: { TL: ['outTLx','outTLy'], TR: ['outTRx','outTRy'], BL: ['outBLx','outBLy'], BR: ['outBRx','outBRy'] },
        };
        function getCalibKeyMap() { return CALIB_KEY_MAPS[calibTarget] || CALIB_KEY_MAPS.camera; }

        function getCornerScreenPos(corner) {
            const keyMap = getCalibKeyMap();
            const w = dispCanvas.clientWidth, h = dispCanvas.clientHeight;
            const kx = keyMap[corner][0], ky = keyMap[corner][1];
            const isRight = corner.includes('R'), isBottom = corner.includes('B');
            const x = isRight ? w * (1 + P[kx] / 100) : w * (P[kx] / 100);
            const y = isBottom ? h * (1 + P[ky] / 100) : h * (P[ky] / 100);
            return { x, y };
        }

        function screenPosToParam(corner, sx, sy) {
            const keyMap = getCalibKeyMap();
            const w = dispCanvas.clientWidth, h = dispCanvas.clientHeight;
            const kx = keyMap[corner][0], ky = keyMap[corner][1];
            const isRight = corner.includes('R'), isBottom = corner.includes('B');
            P[kx] = isRight ? (sx / w - 1) * 100 : (sx / w) * 100;
            P[ky] = isBottom ? (sy / h - 1) * 100 : (sy / h) * 100;
            // Sync slider/number UI
            for (const k of [kx, ky]) {
                const slider = tweaksPanel.querySelector(`input[type="range"][data-key="${k}"]`);
                const numInp = document.getElementById('val-' + k);
                if (slider) slider.value = P[k];
                if (numInp) numInp.value = P[k].toFixed(2);
            }
        }

        function updateCalibCorners() {
            const overlay = document.getElementById('calib-overlay');
            if (!calibMode) { overlay.innerHTML = ''; return; }
            overlay.innerHTML = '';
            for (const c of CALIB_CORNERS) {
                const pos = getCornerScreenPos(c);
                // Handle
                const handle = document.createElement('div');
                const isOut = calibTarget === 'output';
                handle.className = 'calib-corner' + (isOut ? ' output-mode' : '') + (c === calibSelectedCorner ? ' active' : '');
                handle.style.left = pos.x + 'px';
                handle.style.top = pos.y + 'px';
                handle.dataset.corner = c;
                // Label
                const label = document.createElement('div');
                label.className = 'calib-label' + (isOut ? ' output-mode' : '') + (c === calibSelectedCorner ? ' active' : '');
                label.style.left = pos.x + 'px';
                label.style.top = pos.y + 'px';
                label.textContent = c;
                overlay.appendChild(handle);
                overlay.appendChild(label);

                // Mouse down → start drag
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    calibDragging = c;
                    calibSelectedCorner = c;
                    const sel = document.getElementById('calib-corner-select');
                    if (sel) sel.value = c;
                    updateCalibCorners();
                });
            }

            // Draw lines between corners on a small canvas
            let lineCanvas = overlay.querySelector('canvas');
            if (!lineCanvas) {
                lineCanvas = document.createElement('canvas');
                lineCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none';
                overlay.insertBefore(lineCanvas, overlay.firstChild);
            }
            lineCanvas.width = dispCanvas.clientWidth;
            lineCanvas.height = dispCanvas.clientHeight;
            const lctx = lineCanvas.getContext('2d');
            const pts = CALIB_CORNERS.map(c => getCornerScreenPos(c));
            lctx.strokeStyle = calibTarget === 'output' ? 'rgba(136,170,255,0.5)' : 'rgba(0,255,0,0.5)';
            lctx.lineWidth = 1;
            lctx.beginPath();
            lctx.moveTo(pts[0].x, pts[0].y); // TL
            lctx.lineTo(pts[1].x, pts[1].y); // TR
            lctx.lineTo(pts[3].x, pts[3].y); // BR
            lctx.lineTo(pts[2].x, pts[2].y); // BL
            lctx.closePath();
            lctx.stroke();
        }

        // Global mouse move/up for dragging
        document.addEventListener('mousemove', (e) => {
            if (!calibDragging) return;
            const rect = dispCanvas.getBoundingClientRect();
            const sx = e.clientX - rect.left;
            const sy = e.clientY - rect.top;
            screenPosToParam(calibDragging, sx, sy);
            updateCalibCorners();
        });
        document.addEventListener('mouseup', () => { calibDragging = null; });

        // Corner select dropdown sync
        document.addEventListener('change', (e) => {
            if (e.target.id === 'calib-corner-select') {
                calibSelectedCorner = e.target.value;
                updateCalibCorners();
            }
        });

        function log(msg) {
            console.log('[Karaoke]', msg);
            statusEl.textContent = msg;
        }

        // ─── Parse time "M.SS.F" → seconds ───
        function parseTime(timeStr) {
            const cleaned = timeStr.replace(/\s/g, '');
            const parts = cleaned.split('.');
            if (parts.length < 3) return 0;
            return (parseInt(parts[0],10)||0) * 60
                 + (parseInt(parts[1],10)||0)
                 + (parseInt(parts[2],10)||0) * 0.1;
        }

        // ─── Load lyrics ───
        async function loadLyrics() {
            log('Loading lyrics...');
            const resp = await fetch('Hallelujah.json');
            const raw  = await resp.json();
            lyricsData = raw.map((item, i) => {
                const seg  = item.segments[0];
                // Use phoneticWord for particles (has stretched chars like "Haaa lle luuuuuu jaaaah")
                // Use text or finalWord for the subtitle display
                const particleText  = (seg.phoneticWord || seg.text || seg.finalWord || '').trim();
                const subtitleText  = (seg.text || seg.finalWord || '').trim();
                return {
                    index: i,
                    particleText,
                    subtitleText,
                    start: parseTime(seg.startTime),
                    end:   parseTime(seg.endTime),
                };
            });
            log(`Loaded ${lyricsData.length} lyric segments`);
        }

        // ─── Init MediaPipe ───
        async function initFaceLandmarker() {
            log('Loading face model...');
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
            );
            for (const delegate of ["GPU", "CPU"]) {
                try {
                    log(`Trying face model (${delegate})...`);
                    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                            delegate
                        },
                        runningMode: "VIDEO",
                        numFaces: 1,
                        outputFaceBlendshapes: false,
                        outputFacialTransformationMatrixes: false,
                    });
                    log(`Face model loaded (${delegate})`);
                    return;
                } catch (e) {
                    console.warn(`${delegate} failed:`, e);
                    if (delegate === "CPU") throw e;
                }
            }
        }

        async function initPoseLandmarker() {
            log('Loading pose model...');
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
            );
            for (const delegate of ["GPU", "CPU"]) {

                    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {

        // ─── Start webcam ───
        let currentDeviceId = '';

        async function startCamera(deviceId) {
            log('Requesting camera...');
            // Stop existing tracks
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } } };
            if (deviceId) {
                constraints.video.deviceId = { exact: deviceId };
            } else {
                constraints.video.facingMode = 'user';
            }
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            currentDeviceId = stream.getVideoTracks()[0]?.getSettings()?.deviceId || '';
            await new Promise((resolve, reject) => {
                video.onloadedmetadata = resolve;
                video.onerror = reject;
                setTimeout(() => reject(new Error('Camera timeout')), 10000);
            });
            await video.play();
            log('Camera ready');
        }

        async function populateCameraSelect() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            const select = document.getElementById('camera-select');
            if (!select) return;
            select.innerHTML = '';
            for (const d of videoDevices) {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.textContent = d.label || `Camera ${select.options.length + 1}`;
                if (d.deviceId === currentDeviceId) opt.selected = true;
                select.appendChild(opt);
            }
            select.addEventListener('change', async () => {
                try {
                    await startCamera(select.value);
                } catch (e) { log('Camera switch error: ' + e.message); }
            });
        }

        function syncCanvasSize() {
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
                canvas.width = w; canvas.height = h;
                dispCanvas.width = w; dispCanvas.height = h;
                offCanvas.width = w; offCanvas.height = h;
            }
        }

        // ─── Keystone warp: draw video with corner-pin distortion ───
        // Uses triangulated mesh to approximate perspective warp

        // Compute "cover" crop: scale video to fill canvas, crop excess
        function coverRect(vw, vh, cw, ch) {
            const videoAR = vw / vh, canvasAR = cw / ch;
            let sx = 0, sy = 0, sw = vw, sh = vh;
            if (videoAR > canvasAR) {
                // Video wider — crop sides
                sw = vh * canvasAR;
                sx = (vw - sw) / 2;
            } else {
                // Video taller — crop top/bottom
                sh = vw / canvasAR;
                sy = (vh - sh) / 2;
            }
            return { sx, sy, sw, sh };
        }

        function drawWarpedVideo() {
            const w = dispCanvas.width, h = dispCanvas.height;
            if (!w || !h || video.readyState < 2) return;

            dispCtx.clearRect(0, 0, w, h);

            const vw = video.videoWidth, vh = video.videoHeight;
            const crop = coverRect(vw, vh, w, h);

            // Corner positions
            const tl = { x: w * (P.ksTLx / 100),           y: h * (P.ksTLy / 100) };
            const tr = { x: w * (1 + P.ksTRx / 100),       y: h * (P.ksTRy / 100) };
            const bl = { x: w * (P.ksBLx / 100),           y: h * (1 + P.ksBLy / 100) };
            const br = { x: w * (1 + P.ksBRx / 100),       y: h * (1 + P.ksBRy / 100) };

            // Mirror X if cameraMirrored
            let mtl, mtr, mbl, mbr;
            if (cameraMirrored) {
                mtl = { x: w - tl.x, y: tl.y };
                mtr = { x: w - tr.x, y: tr.y };
                mbl = { x: w - bl.x, y: bl.y };
                mbr = { x: w - br.x, y: br.y };
            } else {
                mtl = { ...tl }; mtr = { ...tr }; mbl = { ...bl }; mbr = { ...br };
            }

            // Apply image transform (scale, position, rotation) to corners
            const hasImgTransform = P.imgScale !== 1 || P.imgX !== 0 || P.imgY !== 0 || P.imgRotation !== 0;
            if (hasImgTransform) {
                const cx = w / 2, cy = h / 2;
                const s = P.imgScale;
                const rad = P.imgRotation * Math.PI / 180;
                const cosR = Math.cos(rad), sinR = Math.sin(rad);
                const tx = P.imgX, ty = P.imgY;
                function xfPt(p) {
                    let x = (p.x - cx) * s, y = (p.y - cy) * s;
                    return { x: x * cosR - y * sinR + cx + tx, y: x * sinR + y * cosR + cy + ty };
                }
                mtl = xfPt(mtl); mtr = xfPt(mtr); mbl = xfPt(mbl); mbr = xfPt(mbr);
            }

            const hasWarp = P.ksTLx !== 0 || P.ksTLy !== 0 || P.ksTRx !== 0 || P.ksTRy !== 0 ||
                            P.ksBLx !== 0 || P.ksBLy !== 0 || P.ksBRx !== 0 || P.ksBRy !== 0;

            if (!hasWarp && !hasImgTransform) {
                // No warp or transform — simple draw with cover crop
                dispCtx.save();
                if (cameraMirrored) {
                    dispCtx.translate(w, 0);
                    dispCtx.scale(-1, 1);
                }
                dispCtx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, w, h);
                dispCtx.restore();
                return;
            }

            // Subdivide into grid for smooth warp
            const divs = 8;
            for (let gy = 0; gy < divs; gy++) {
                for (let gx = 0; gx < divs; gx++) {
                    const u0 = gx / divs, u1 = (gx + 1) / divs;
                    const v0 = gy / divs, v1 = (gy + 1) / divs;

                    // Source coords within the cropped region
                    const srcX0 = crop.sx + crop.sw * u0, srcX1 = crop.sx + crop.sw * u1;
                    const srcY0 = crop.sy + crop.sh * v0, srcY1 = crop.sy + crop.sh * v1;

                    // Bilinear interpolation of corner positions
                    const p00 = bilerp(mtl, mtr, mbl, mbr, u0, v0);
                    const p10 = bilerp(mtl, mtr, mbl, mbr, u1, v0);
                    const p01 = bilerp(mtl, mtr, mbl, mbr, u0, v1);
                    const p11 = bilerp(mtl, mtr, mbl, mbr, u1, v1);

                    // Draw two triangles per cell
                    drawTriangle(dispCtx, video,
                        srcX0, srcY0, srcX1, srcY0, srcX0, srcY1,
                        p00.x, p00.y, p10.x, p10.y, p01.x, p01.y);
                    drawTriangle(dispCtx, video,
                        srcX1, srcY0, srcX1, srcY1, srcX0, srcY1,
                        p10.x, p10.y, p11.x, p11.y, p01.x, p01.y);
                }
            }
        }

        function bilerp(tl, tr, bl, br, u, v) {
            return {
                x: (1 - v) * ((1 - u) * tl.x + u * tr.x) + v * ((1 - u) * bl.x + u * br.x),
                y: (1 - v) * ((1 - u) * tl.y + u * tr.y) + v * ((1 - u) * bl.y + u * br.y),
            };
        }

        // Draw a textured triangle using affine transform
        function drawTriangle(dCtx, img, sx0,sy0, sx1,sy1, sx2,sy2, dx0,dy0, dx1,dy1, dx2,dy2) {
            dCtx.save();
            dCtx.beginPath();
            dCtx.moveTo(dx0, dy0);
            dCtx.lineTo(dx1, dy1);
            dCtx.lineTo(dx2, dy2);
            dCtx.closePath();
            dCtx.clip();

            // Solve affine: source triangle → dest triangle
            const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
            if (Math.abs(denom) < 0.001) { dCtx.restore(); return; }

            const m11 = (dx0 * (sy1 - sy2) + dx1 * (sy2 - sy0) + dx2 * (sy0 - sy1)) / denom;
            const m12 = (dx0 * (sx2 - sx1) + dx1 * (sx0 - sx2) + dx2 * (sx1 - sx0)) / denom;
            const m13 = (dx0 * (sx1*sy2 - sx2*sy1) + dx1 * (sx2*sy0 - sx0*sy2) + dx2 * (sx0*sy1 - sx1*sy0)) / denom;
            const m21 = (dy0 * (sy1 - sy2) + dy1 * (sy2 - sy0) + dy2 * (sy0 - sy1)) / denom;
            const m22 = (dy0 * (sx2 - sx1) + dy1 * (sx0 - sx2) + dy2 * (sx1 - sx0)) / denom;
            const m23 = (dy0 * (sx1*sy2 - sx2*sy1) + dy1 * (sx2*sy0 - sx0*sy2) + dy2 * (sx0*sy1 - sx1*sy0)) / denom;

            dCtx.setTransform(m11, m21, m12, m22, m13, m23);
            dCtx.drawImage(img, 0, 0);
            dCtx.restore();
        }

        // ─── Output warp: corner-pin the overlay ───
        function applyOutputWarp() {
            const w = canvas.width, h = canvas.height;
            const hasWarp = P.outTLx !== 0 || P.outTLy !== 0 || P.outTRx !== 0 || P.outTRy !== 0 ||
                            P.outBLx !== 0 || P.outBLy !== 0 || P.outBRx !== 0 || P.outBRy !== 0;
            const hasOutTransform = P.outScale !== 1 || P.outImgX !== 0 || P.outImgY !== 0 || P.outRotation !== 0;
            if (!hasWarp && !hasOutTransform) return;

            // Copy canvas content to offscreen, then warp back
            offCtx.clearRect(0, 0, w, h);
            offCtx.drawImage(canvas, 0, 0);
            ctx.clearRect(0, 0, w, h);

            let tl = { x: w * (P.outTLx / 100),       y: h * (P.outTLy / 100) };
            let tr = { x: w * (1 + P.outTRx / 100),   y: h * (P.outTRy / 100) };
            let bl = { x: w * (P.outBLx / 100),       y: h * (1 + P.outBLy / 100) };
            let br = { x: w * (1 + P.outBRx / 100),   y: h * (1 + P.outBRy / 100) };

            // Apply output transform (scale, position, rotation) to corners
            if (hasOutTransform) {
                const cx = w / 2, cy = h / 2;
                const s = P.outScale;
                const rad = P.outRotation * Math.PI / 180;
                const cosR = Math.cos(rad), sinR = Math.sin(rad);
                const tx = P.outImgX, ty = P.outImgY;
                function xfOut(p) {
                    let x = (p.x - cx) * s, y = (p.y - cy) * s;
                    return { x: x * cosR - y * sinR + cx + tx, y: x * sinR + y * cosR + cy + ty };
                }
                tl = xfOut(tl); tr = xfOut(tr); bl = xfOut(bl); br = xfOut(br);
            }

            const divs = 8;
            for (let gy = 0; gy < divs; gy++) {
                for (let gx = 0; gx < divs; gx++) {
                    const u0 = gx / divs, u1 = (gx + 1) / divs;
                    const v0 = gy / divs, v1 = (gy + 1) / divs;

                    const srcX0 = w * u0, srcX1 = w * u1;
                    const srcY0 = h * v0, srcY1 = h * v1;

                    const p00 = bilerp(tl, tr, bl, br, u0, v0);
                    const p10 = bilerp(tl, tr, bl, br, u1, v0);
                    const p01 = bilerp(tl, tr, bl, br, u0, v1);
                    const p11 = bilerp(tl, tr, bl, br, u1, v1);

                    drawTriangle(ctx, offCanvas,
                        srcX0, srcY0, srcX1, srcY0, srcX0, srcY1,
                        p00.x, p00.y, p10.x, p10.y, p01.x, p01.y);
                    drawTriangle(ctx, offCanvas,
                        srcX1, srcY0, srcX1, srcY1, srcX0, srcY1,
                        p10.x, p10.y, p11.x, p11.y, p01.x, p01.y);
                }
            }
        }

        // ─── Output grid overlay ───
        function renderOutputGrid() {
            const w = canvas.width, h = canvas.height;

            // Compute warped corners
            let tl = { x: w * (P.outTLx / 100),       y: h * (P.outTLy / 100) };
            let tr = { x: w * (1 + P.outTRx / 100),   y: h * (P.outTRy / 100) };
            let bl = { x: w * (P.outBLx / 100),       y: h * (1 + P.outBLy / 100) };
            let br = { x: w * (1 + P.outBRx / 100),   y: h * (1 + P.outBRy / 100) };

            // Apply output transform so grid matches actual output
            if (P.outScale !== 1 || P.outImgX !== 0 || P.outImgY !== 0 || P.outRotation !== 0) {
                const cx = w / 2, cy = h / 2;
                const s = P.outScale;
                const rad = P.outRotation * Math.PI / 180;
                const cosR = Math.cos(rad), sinR = Math.sin(rad);
                const tx = P.outImgX, ty = P.outImgY;
                function xfGrid(p) {
                    let x = (p.x - cx) * s, y = (p.y - cy) * s;
                    return { x: x * cosR - y * sinR + cx + tx, y: x * sinR + y * cosR + cy + ty };
                }
                tl = xfGrid(tl); tr = xfGrid(tr); bl = xfGrid(bl); br = xfGrid(br);
            }

            const divs = 8;
            ctx.save();
            ctx.lineWidth = 1;

            // Grid lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 1; i < divs; i++) {
                const t = i / divs;
                // Horizontal line
                const lStart = bilerp(tl, tr, bl, br, 0, t);
                const lEnd   = bilerp(tl, tr, bl, br, 1, t);
                ctx.beginPath();
                ctx.moveTo(lStart.x, lStart.y);
                ctx.lineTo(lEnd.x, lEnd.y);
                ctx.stroke();
                // Vertical line
                const tStart = bilerp(tl, tr, bl, br, t, 0);
                const tEnd   = bilerp(tl, tr, bl, br, t, 1);
                ctx.beginPath();
                ctx.moveTo(tStart.x, tStart.y);
                ctx.lineTo(tEnd.x, tEnd.y);
                ctx.stroke();
            }

            // Border
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tl.x, tl.y);
            ctx.lineTo(tr.x, tr.y);
            ctx.lineTo(br.x, br.y);
            ctx.lineTo(bl.x, bl.y);
            ctx.closePath();
            ctx.stroke();

            // Corner dots
            ctx.fillStyle = 'rgba(0, 255, 100, 0.9)';
            for (const p of [tl, tr, bl, br]) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // ─── Detect face ───
        const FACE_LOST_GRACE = 500; // ms to keep last position after losing tracking
        let lastFaceSeenTs = 0;
        let lastPoseDetectTs = -1;

        // Shared smoothing update for any tracking source
        function applyTracking(rawX, rawY, clampedYaw, clampedPitch, timestamp) {
            const sm = 1 - P.mouthSmooth;
            if (!hasFace) {
                smoothMouthX = rawX; smoothMouthY = rawY;
                smoothYaw = clampedYaw;
                smoothPitch = clampedPitch;
            } else {
                smoothMouthX += (rawX - smoothMouthX) * sm;
                smoothMouthY += (rawY - smoothMouthY) * sm;
                smoothYaw += (clampedYaw - smoothYaw) * sm * 0.5;
                smoothPitch += (clampedPitch - smoothPitch) * sm * 0.5;
            }
            mouthX = smoothMouthX;
            mouthY = smoothMouthY;
            faceYaw = smoothYaw;
            facePitch = smoothPitch;
            hasFace = true;
            lastFaceSeenTs = timestamp;
        }

        // Try face landmarks → face nose fallback → returns false if no face detected
        function tryFaceDetect(ts, timestamp) {
            if (!faceLandmarker) return false;
            const results = faceLandmarker.detectForVideo(dispCanvas, ts);
            if (!results.faceLandmarks || results.faceLandmarks.length === 0) return false;

            const lm = results.faceLandmarks[0];
            const upper = lm[13], lower = lm[14], nose = lm[1];
            const chin = lm[152];
            let trackX, trackY;

            if (upper && lower && upper.x > 0 && lower.x > 0) {
                trackX = (upper.x + lower.x) / 2;
                trackY = (upper.y + lower.y) / 2;
            } else if (nose) {
                const mouthEstY = chin ? (nose.y + chin.y) / 2 : nose.y + 0.04;
                trackX = nose.x;
                trackY = mouthEstY;
            } else {
                return false;
            }

            const rawX = trackX * canvas.width;
            const rawY = trackY * canvas.height;

            // Face yaw
            const rightEdge = lm[234], leftEdge = lm[454];
            const faceCX = (rightEdge.x + leftEdge.x) / 2;
            const faceW = Math.abs(rightEdge.x - leftEdge.x);
            const rawYaw = faceW > 0.001
                ? (nose.x - faceCX) / (faceW * 0.5)
                : 0;

            // Face pitch
            const forehead = lm[10];
            const faceCY = (forehead.y + chin.y) / 2;
            const faceH = Math.abs(chin.y - forehead.y);
            const rawPitch = faceH > 0.001
                ? (nose.y - faceCY) / (faceH * 0.5)
                : 0;

            applyTracking(rawX, rawY,
                Math.max(-1, Math.min(1, rawYaw)),
                Math.max(-1, Math.min(1, rawPitch)),
                timestamp);
            return true;
        }

        // Pose fallback: use head position from pose landmarks
        // Pose landmarks: 0=nose, 2=left eye inner, 5=right eye inner,
        //                 9=mouth left, 10=mouth right, 11=left shoulder, 12=right shoulder
        function tryPoseDetect(ts, timestamp) {
            if (!poseLandmarker) return false;
            if (ts <= lastPoseDetectTs) return false;
            lastPoseDetectTs = ts;

            const results = poseLandmarker.detectForVideo(dispCanvas, ts);
            if (!results.landmarks || results.landmarks.length === 0) return false;

            const lm = results.landmarks[0];
            const nose = lm[0];
            const mouthL = lm[9], mouthR = lm[10];
            if (!nose) return false;

            // Use pose mouth landmarks if available, else nose
            let trackX, trackY;
            if (mouthL && mouthR && mouthL.x > 0 && mouthR.x > 0) {
                trackX = (mouthL.x + mouthR.x) / 2;
                trackY = (mouthL.y + mouthR.y) / 2;
            } else {
                trackX = nose.x;
                trackY = nose.y + 0.04; // offset down toward mouth
            }

            const rawX = trackX * canvas.width;
            const rawY = trackY * canvas.height;

            // Estimate yaw from shoulders
            const lShoulder = lm[11], rShoulder = lm[12];
            let estYaw = 0;
            if (lShoulder && rShoulder) {
                const shoulderCX = (lShoulder.x + rShoulder.x) / 2;
                const shoulderW = Math.abs(lShoulder.x - rShoulder.x);
                if (shoulderW > 0.01) {
                    estYaw = (nose.x - shoulderCX) / (shoulderW * 0.5);
                    estYaw = Math.max(-1, Math.min(1, estYaw));
                }
            }

            applyTracking(rawX, rawY, estYaw, 0, timestamp);
            return true;
        }

        function detectFace(timestamp) {
            const ts = Math.round(timestamp);
            if (ts <= lastDetectTs) return;
            lastDetectTs = ts;
            try {
                // Primary: face landmarks (mouth → face nose fallback)
                if (tryFaceDetect(ts, timestamp)) return;

                // Secondary: pose tracking (works at distance / extreme angles)
                if (tryPoseDetect(ts, timestamp)) return;

                // No tracking source — grace period before giving up
                if (hasFace && (timestamp - lastFaceSeenTs) > FACE_LOST_GRACE) {
                    hasFace = false;
                }
            } catch (e) { console.warn('Face detect error:', e); }
        }

        // ─── Noise ───
        function noise(t, seed) {
            return Math.sin(t * 2.1 + seed * 1.7) * 0.5
                 + Math.sin(t * 4.3 + seed * 3.1) * 0.3
                 + Math.sin(t * 7.7 + seed * 0.3) * 0.2;
        }

        // ─── Cubic bezier ───
        function cubicBezier(t, p0, p1, p2, p3) {
            const u = 1-t, u2 = u*u, u3 = u2*u, t2 = t*t, t3 = t2*t;
            return u3*p0 + 3*u2*t*p1 + 3*u*t2*p2 + t3*p3;
        }

        // ─── Get particle position ───
        // Each particle has its own spline: from its birth mouth pos → fixed upper-left target
        function getParticlePos(p, t) {
            const W = canvas.width, H = canvas.height;
            // Target: upper-left area of the screen with per-particle vertical noise
            const tx = W * P.targetX;
            const tyBase = H * P.targetY;
            const targetOffset = (Math.sin(p.seed * 7.13) * 0.5 + Math.sin(p.seed * 3.71) * 0.3 + Math.sin(p.seed * 11.3) * 0.2) * P.targetNoise;
            const ty = tyBase + targetOffset;
            // Vector from start to target
            const dx = tx - p.startX;
            const dy = ty - p.startY;
            // Perpendicular direction (for curvature)
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            const perpX = -dy / len;
            const perpY =  dx / len;
            // Control points along the start→target vector with lateral offset
            const curveOffset = len * P.cpCurve;
            const cp1x = p.startX + dx * P.cpPull1 + perpX * curveOffset;
            const cp1y = p.startY + dy * P.cpPull1 + perpY * curveOffset;
            const cp2x = p.startX + dx * P.cpPull2 + perpX * curveOffset * 0.5;
            const cp2y = p.startY + dy * P.cpPull2 + perpY * curveOffset * 0.5;

            const x = cubicBezier(t, p.startX, cp1x, cp2x, tx);
            const y = cubicBezier(t, p.startY, cp1y, cp2y, ty);
            return { x, y };
        }

        // ─── Spawn characters ───
        function updateLyricSpawning(currentTime) {
            let currentSeg = null, currentSegIdx = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].start && currentTime < lyricsData[i].end) {
                    currentSeg = lyricsData[i]; currentSegIdx = i; break;
                }
            }
            if (currentSegIdx !== lastSegmentIndex) {
                lastSegmentIndex = currentSegIdx;
                charSpawnIndex = 0;
            }
            if (!currentSeg || !hasFace) return;
            const text = currentSeg.particleText;
            if (!text || text.length === 0) return;
            const segDuration = currentSeg.end - currentSeg.start;
            if (segDuration <= 0) return;
            const elapsed = currentTime - currentSeg.start;
            // Distribute chars evenly: first char spawns immediately, last char at ~95% of segment
            // Using (length) as divisor ensures all chars spawn before segment ends
            const charsToSpawn = Math.min(text.length,
                1 + Math.floor((elapsed / segDuration) * text.length));
            const now = performance.now() / 1000;
            while (charSpawnIndex < charsToSpawn && charSpawnIndex < text.length) {
                // Burst direction based on face yaw + pitch:
                // Build a 2D direction vector from face orientation
                // yaw: positive = facing right (screen), negative = facing left
                // pitch: positive = looking down, negative = looking up
                // Mirror yaw for screen space (webcam is mirrored)
                let dirX = faceYaw;   // left/right
                let dirY = facePitch; // up/down
                // Normalize; if face is nearly centered, default to left burst
                let dirLen = Math.sqrt(dirX * dirX + dirY * dirY);
                if (dirLen < 0.15) {
                    dirX = -1; dirY = -0.2; dirLen = Math.sqrt(dirX * dirX + dirY * dirY);
                }
                dirX /= dirLen; dirY /= dirLen;
                // Add random spread (±0.4 radians)
                const baseAngle = Math.atan2(dirY, dirX);
                const spread = (Math.random() - 0.5) * 0.8;
                const burstAngle = baseAngle + spread;
                particles.push({
                    char: text[charSpawnIndex],
                    spawnTime: now,
                    startX: mouthX,
                    startY: mouthY,
                    seed: Math.random() * 100,
                    burstDx: Math.cos(burstAngle),
                    burstDy: Math.sin(burstAngle),
                });
                charSpawnIndex++;
            }
        }

        // ─── Karaoke-style subtitle (canvas-rendered) ───
        let subtitleData = null; // { text, highlightChars } or null

        function updateSubtitle(currentTime) {
            let curIdx = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].start && currentTime < lyricsData[i].end) {
                    curIdx = i; break;
                }
            }
            if (curIdx === -1) {
                for (let i = 0; i < lyricsData.length; i++) {
                    if (currentTime < lyricsData[i].start) { curIdx = i; break; }
                }
            }
            if (curIdx === -1) { subtitleData = null; return; }

            const seg = lyricsData[curIdx];
            const text = seg.particleText;

            if (currentTime < seg.start) {
                subtitleData = { text, highlightChars: -1 }; // -1 = all dim
                return;
            }

            const progress = (currentTime - seg.start) / (seg.end - seg.start);
            subtitleData = { text, highlightChars: progress * text.length };
        }

        function renderSubtitle() {
            if (!subtitleData) return;
            const { text, highlightChars } = subtitleData;
            const w = canvas.width, h = canvas.height;

            const fontSize = 22 * P.subScale;
            ctx.save();
            ctx.font = `${fontSize}px sans-serif`;
            ctx.textBaseline = 'middle';

            const padX = 28, padY = 12;
            const maxW = Math.min(P.subMaxWidth * P.subScale, w - padX * 2);
            const lineH = fontSize * 1.5;

            // Word-wrap into lines, tracking character indices
            const words = text.split(' ');
            const lines = [];       // [{text, startIdx}]
            let curLine = '';
            let curIdx = 0;
            for (let wi = 0; wi < words.length; wi++) {
                const word = words[wi];
                const test = curLine ? curLine + ' ' + word : word;
                if (curLine && ctx.measureText(test).width > maxW) {
                    lines.push({ text: curLine, startIdx: curIdx });
                    curIdx += curLine.length + 1; // +1 for space
                    curLine = word;
                } else {
                    curLine = test;
                }
            }
            if (curLine) lines.push({ text: curLine, startIdx: curIdx });

            // Compute box dimensions
            let widestLine = 0;
            for (const ln of lines) widestLine = Math.max(widestLine, ctx.measureText(ln.text).width);
            const totalTextH = lineH * lines.length;
            const boxW = Math.max(widestLine + padX * 2, 200);
            const boxH = totalTextH + padY * 2;

            // Position (anchored at bottom, clamped to canvas)
            const cx = w / 2 + P.subX;
            const by = h - P.subY;
            let boxX = cx - boxW / 2;
            const boxY = by - boxH;
            // Clamp horizontally to stay within canvas
            if (boxX < 0) boxX = 0;
            if (boxX + boxW > w) boxX = w - boxW;

            // Apply flip
            if (lyricsFlipped) {
                ctx.translate(cx, 0);
                ctx.scale(-1, 1);
                ctx.translate(-cx, 0);
            }

            // Background rounded rect
            const r = 10;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath();
            ctx.moveTo(boxX + r, boxY);
            ctx.lineTo(boxX + boxW - r, boxY);
            ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + r);
            ctx.lineTo(boxX + boxW, boxY + boxH - r);
            ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - r, boxY + boxH);
            ctx.lineTo(boxX + r, boxY + boxH);
            ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - r);
            ctx.lineTo(boxX, boxY + r);
            ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY);
            ctx.closePath();
            ctx.fill();

            // Draw each line
            for (let li = 0; li < lines.length; li++) {
                const ln = lines[li];
                const lnW = ctx.measureText(ln.text).width;
                let curX = boxX + (boxW - lnW) / 2;
                const curY = boxY + padY + lineH * li + lineH / 2;

                for (let ci = 0; ci < ln.text.length; ci++) {
                    const ch = ln.text[ci];
                    const gi = ln.startIdx + ci; // global char index
                    if (highlightChars === -1) {
                        ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    } else if (gi < Math.floor(highlightChars)) {
                        ctx.fillStyle = '#88aaff';
                    } else if (gi < highlightChars) {
                        const frac = highlightChars - gi;
                        const cr = Math.round(255 - (255 - 136) * frac);
                        const cg = Math.round(255 - (255 - 170) * frac);
                        ctx.fillStyle = `rgb(${cr},${cg},255)`;
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    }
                    ctx.fillText(ch, curX, curY);
                    curX += ctx.measureText(ch).width;
                }
            }

            ctx.restore();
        }

        // ─── Lerp helper ───
        function lerp(a, b, t) { return a + (b - a) * t; }

        // ─── Ease-out: fast start, slow finish (chars shoot out then drift) ───
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // ─── Render spline visualizer ───
        function renderSplineViz() {
            if (!hasFace) return;
            const W = canvas.width, H = canvas.height;
            // Draw a few sample splines from the current mouth position with varying seeds
            const seeds = [0, 15, 30, 50, 70, 85];
            ctx.save();
            for (let si = 0; si < seeds.length; si++) {
                const seed = seeds[si];
                const fakeP = { startX: mouthX, startY: mouthY, seed };
                // Sample the cubic bezier path
                const steps = 40;
                ctx.beginPath();
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const pos = getParticlePos(fakeP, t);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                const hue = (si / seeds.length) * 360;
                ctx.strokeStyle = `hsla(${hue}, 80%, 65%, 0.6)`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Draw control points for the first spline
                if (si === 0) {
                    const tx = W * P.targetX;
                    const tyBase = H * P.targetY;
                    const targetOffset = (Math.sin(seed * 7.13) * 0.5 + Math.sin(seed * 3.71) * 0.3 + Math.sin(seed * 11.3) * 0.2) * P.targetNoise;
                    const ty = tyBase + targetOffset;
                    const dx = tx - fakeP.startX, dy = ty - fakeP.startY;
                    const len = Math.sqrt(dx*dx + dy*dy) || 1;
                    const perpX = -dy / len, perpY = dx / len;
                    const curveOffset = len * P.cpCurve;
                    const cp1x = fakeP.startX + dx * P.cpPull1 + perpX * curveOffset;
                    const cp1y = fakeP.startY + dy * P.cpPull1 + perpY * curveOffset;
                    const cp2x = fakeP.startX + dx * P.cpPull2 + perpX * curveOffset * 0.5;
                    const cp2y = fakeP.startY + dy * P.cpPull2 + perpY * curveOffset * 0.5;
                    // CP1
                    ctx.fillStyle = 'rgba(255,100,100,0.8)';
                    ctx.beginPath(); ctx.arc(cp1x, cp1y, 5, 0, Math.PI * 2); ctx.fill();
                    // CP2
                    ctx.fillStyle = 'rgba(100,100,255,0.8)';
                    ctx.beginPath(); ctx.arc(cp2x, cp2y, 5, 0, Math.PI * 2); ctx.fill();
                    // Target
                    ctx.fillStyle = 'rgba(100,255,100,0.8)';
                    ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2); ctx.fill();
                    // Start
                    ctx.fillStyle = 'rgba(255,255,100,0.8)';
                    ctx.beginPath(); ctx.arc(fakeP.startX, fakeP.startY, 5, 0, Math.PI * 2); ctx.fill();
                    // Tangent lines to control points
                    ctx.setLineDash([4, 4]);
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(fakeP.startX, fakeP.startY); ctx.lineTo(cp1x, cp1y); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(cp2x, cp2y); ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            ctx.restore();
        }

        // ─── Render particles ───
        function renderParticles(nowMs) {
            const nowSec = nowMs / 1000;
            particles = particles.filter(p => (nowSec - p.spawnTime) < P.charLifetime);

            for (const p of particles) {
                const age = nowSec - p.spawnTime;
                const linearT = Math.min(age / P.charLifetime, 1.0);

                // Ease-out: particles shoot forward from the mouth quickly,
                // then slow down and spread out — making words readable at the far end
                const t = easeOutCubic(linearT);

                const splinePos = getParticlePos(p, t);

                // Burst phase: for the first ~8% of life, shoot outward from the mouth
                // then smoothly blend into the spline path
                let pos;
                if (linearT < P.burstDuration) {
                    const burstT = linearT / P.burstDuration; // 0→1 during burst
                    const burstEased = 1 - Math.pow(1 - burstT, 2); // ease-out
                    const burstX = p.startX + p.burstDx * P.burstDistance * burstEased;
                    const burstY = p.startY + p.burstDy * P.burstDistance * burstEased;
                    // Blend from burst position to spline position
                    const blend = burstT * burstT; // ease-in blend toward spline
                    pos = {
                        x: lerp(burstX, splinePos.x, blend),
                        y: lerp(burstY, splinePos.y, blend),
                    };
                } else {
                    pos = splinePos;
                }

                // Noise: perpendicular wobble
                const noiseVal = noise(age * P.noiseFreq, p.seed) * P.noiseAmp;

                // Opacity: fade in, then fade out well before reaching spline end
                let alpha = 1.0;
                if (t < P.fadeInEnd) {
                    alpha = t <= P.fadeInStart ? 0 : (t - P.fadeInStart) / (P.fadeInEnd - P.fadeInStart);
                }
                // Fade based on eased spline position — chars disappear before
                // they pile up at the endpoint
                if (t > P.fadeStart) {
                    alpha *= 1.0 - (t - P.fadeStart) / (P.fadeEnd - P.fadeStart);
                }
                alpha = Math.max(0, Math.min(1, alpha));
                if (alpha <= 0) continue;

                // Color: continuous gradient from start → end over lifetime
                const r = Math.round(lerp(P.colorStartR, P.colorEndR, linearT));
                const g = Math.round(lerp(P.colorStartG, P.colorEndG, linearT));
                const b = Math.round(lerp(P.colorStartB, P.colorEndB, linearT));

                // Size: spawn tiny, grow to full size as they travel out
                // Shoots out small from mouth, reaches full size around 30% of life
                const growT = Math.min(linearT / 0.3, 1.0);
                const growEased = 1 - Math.pow(1 - growT, 2); // ease-out quad
                const scale = lerp(0.15, 1.0, growEased);
                const size = P.charSize * scale;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = `bold ${size}px 'Helvetica Neue', Arial, sans-serif`;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fillText(p.char, pos.x, pos.y + noiseVal);
                ctx.restore();
            }
        }

        // ─── Main loop ───
        let lastFaceDetect = 0;
        const FACE_DETECT_INTERVAL = 50;

        function animate(timestamp) {
            if (!running) return;
            syncCanvasSize();
            drawWarpedVideo();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (timestamp - lastFaceDetect > FACE_DETECT_INTERVAL) {
                detectFace(timestamp);
                lastFaceDetect = timestamp;
            }

            if (!audio.paused) {
                const syncTime = audio.currentTime + P.syncOffset;
                updateLyricSpawning(syncTime);
                updateSubtitle(syncTime);
            }

            if (showSplineViz) renderSplineViz();
            renderParticles(timestamp);
            renderSubtitle();

            // Mouth dot (hidden in clean mode)
            if (hasFace && !cleanMode) {
                ctx.save();
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.arc(mouthX, mouthY, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ff88cc';
                ctx.fill();
                ctx.restore();
            }

            applyOutputWarp();
            if (showOutputGrid) renderOutputGrid();
            if (calibMode && !calibDragging) updateCalibCorners();

            requestAnimationFrame(animate);
        }

        // ─── Startup ───
        async function init() {
            await loadParams();
            buildTweaksUI();
            try {
                await Promise.all([loadLyrics(), initFaceLandmarker(), initPoseLandmarker()]);
            } catch (e) {
                log('Error loading: ' + e.message);
                console.error(e);
            }
            try {
                await startCamera(P.cameraDeviceId || undefined);
                await populateCameraSelect();
            } catch (e) { log('Camera error: ' + e.message); console.error(e); }
            startBtn.disabled = false;
            startBtn.textContent = 'Click to Start';
            log('Ready');
        }

        // ─── "1" key: toggle clean mode (hide UI + webcam, black background) ───
        let cleanMode = true;

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            running = true;
            // Apply default clean mode
            dispCanvas.style.display = 'none';
            tweaksToggle.style.display = 'none';
            statusEl.style.display = 'none';
            audio.play().catch(e => { log('Audio error: ' + e.message); });
            requestAnimationFrame(animate);
        });
        function toggleCleanMode() {
            cleanMode = !cleanMode;
            dispCanvas.style.display = cleanMode ? 'none' : '';
            tweaksToggle.style.display = cleanMode ? 'none' : '';
            tweaksPanel.classList.remove('open');
            tweaksPanel.style.display = cleanMode ? 'none' : '';
            statusEl.style.display = cleanMode ? 'none' : '';
        }
        document.addEventListener('keydown', (e) => {
            // Arrow key nudge for calibration
            if (calibMode && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const step = e.ctrlKey || e.metaKey ? P.calibNudge * 4 : e.shiftKey ? P.calibNudge * 0.25 : P.calibNudge;
                const c = calibSelectedCorner;
                const keyMap = getCalibKeyMap();
                const kx = keyMap[c][0], ky = keyMap[c][1];
                if (e.key === 'ArrowLeft')  P[kx] -= step;
                if (e.key === 'ArrowRight') P[kx] += step;
                if (e.key === 'ArrowUp')    P[ky] -= step;
                if (e.key === 'ArrowDown')  P[ky] += step;
                // Sync UI
                for (const k of [kx, ky]) {
                    const slider = tweaksPanel.querySelector(`input[type="range"][data-key="${k}"]`);
                    const numInp = document.getElementById('val-' + k);
                    if (slider) slider.value = P[k];
                    if (numInp) numInp.value = P[k].toFixed(2);
                }
                updateCalibCorners();
                return;
            }
            if (e.key === '1') {
                toggleCleanMode();
            }
            if (e.key === '2') {
                // Restart song from the beginning
                audio.currentTime = 0;
                particles = [];
                lastSegmentIndex = -1;
                charSpawnIndex = 0;
                subtitleBox.innerHTML = '';
                if (audio.paused && running) {
                    audio.play().catch(err => log('Audio error: ' + err.message));
                }
                log('Restarted');
            }
        });

        init();
    </script>
</body>
</html>
